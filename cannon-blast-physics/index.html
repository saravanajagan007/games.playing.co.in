<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cannon Ball Physics</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #94a3b8; font-weight: 700; }
canvas { background: #0284c7; border: 2px solid #334155; border-radius: 8px; margin: 16px auto; }
button { background: #475569; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>💣 CANNON SIEGE</h1>
  <span>Fortress Demolition</span>
</header>
<canvas id="c" width="400" height="280"></canvas>
<button id="btn-fire">FIRE CANNON 💥</button>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let ball = { x: 50, y: 220, vx: 0, vy: 0, flying: false };

function update() {
  if (ball.flying) {
    ball.vy += 0.3;
    ball.x += ball.vx;
    ball.y += ball.vy;
    if (ball.y > 240) ball.flying = false;
  }
  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(0, 0, 400, 280);

  // Ground
  ctx.fillStyle = '#65a30d';
  ctx.fillRect(0, 240, 400, 40);

  // Cannon
  ctx.fillStyle = '#334155';
  ctx.fillRect(30, 220, 30, 20);

  // Fortress
  ctx.fillStyle = '#475569';
  ctx.fillRect(320, 160, 50, 80);

  // Cannonball
  if (ball.flying) {
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, 8, 0, Math.PI*2);
    ctx.fill();
  }
}

document.getElementById('btn-fire').onclick = function() {
  ball = { x: 50, y: 220, vx: 9, vy: -7, flying: true };
};
update();
</script>
</body>
</html>
