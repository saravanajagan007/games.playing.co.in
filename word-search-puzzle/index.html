<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Word Search Quest</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #f472b6; font-weight: 700; }
#matrix { display: grid; grid-template-columns: repeat(8, 42px); grid-template-rows: repeat(8, 42px); gap: 4px; margin: 16px auto; background: #1e293b; padding: 10px; border-radius: 12px; }
.letter { width: 42px; height: 42px; background: #0f172a; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; font-weight: 700; cursor: pointer; border: 1px solid #334155; }
.letter.selected { background: #ec4899; color: white; }
.letter.found { background: #22c55e; color: white; }
#word-list { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 380px; margin-top: 10px; }
.word-tag { background: #334155; padding: 4px 10px; border-radius: 4px; font-weight: 600; font-size: 0.9rem; }
.word-tag.done { text-decoration: line-through; opacity: 0.5; background: #1e293b; color: #22c55e; }
</style>
</head>
<body>
<header>
  <h1>🔍 WORD SEARCH</h1>
  <span>Found: <span id="found-count" style="color: #facc15;">0/4</span></span>
</header>
<div id="matrix"></div>
<div id="word-list">
  <span class="word-tag" id="w-GAME">GAME</span>
  <span class="word-tag" id="w-PLAY">PLAY</span>
  <span class="word-tag" id="w-CODE">CODE</span>
  <span class="word-tag" id="w-STAR">STAR</span>
</div>
<script>
const GRID_DATA = [
  ['G','A','M','E','W','X','Y','Z'],
  ['P','O','P','L','A','Y','K','R'],
  ['C','O','D','E','F','H','I','J'],
  ['S','T','A','R','L','M','N','O'],
  ['A','B','C','D','E','F','G','H'],
  ['Q','W','E','R','T','Y','U','I'],
  ['O','P','A','S','D','F','G','H'],
  ['J','K','L','Z','X','C','V','B']
];

const WORDS = ["GAME", "PLAY", "CODE", "STAR"];
let foundWords = [];
let selectedCells = [];

const mEl = document.getElementById('matrix');
for (let r=0; r<8; r++) {
  for (let c=0; c<8; c++) {
    const el = document.createElement('div');
    el.className = 'letter';
    el.innerText = GRID_DATA[r][c];
    el.onclick = () => onLetterClick(r, c, el);
    mEl.appendChild(el);
  }
}

function onLetterClick(r, c, el) {
  if (el.classList.contains('found')) return;
  el.classList.toggle('selected');
  if (el.classList.contains('selected')) {
    selectedCells.push({ r, c, char: GRID_DATA[r][c], el });
  } else {
    selectedCells = selectedCells.filter(cell => cell.el !== el);
  }

  const str = selectedCells.map(c => c.char).join('');
  if (WORDS.includes(str) && !foundWords.includes(str)) {
    foundWords.push(str);
    selectedCells.forEach(cell => {
      cell.el.classList.remove('selected');
      cell.el.classList.add('found');
    });
    document.getElementById(`w-${str}`).classList.add('done');
    selectedCells = [];
    document.getElementById('found-count').innerText = `${foundWords.length}/4`;
    if (foundWords.length === 4) {
      setTimeout(() => alert("Superb! You discovered all words!"), 150);
    }
  }
}
</script>
</body>
</html>
