<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tap Tap Dash</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #38bdf8; font-weight: 700; }
canvas { background: #0284c7; border: 2px solid #38bdf8; border-radius: 8px; margin: 16px auto; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>⚡ TAP TAP DASH</h1>
  <span>Level: 1</span>
</header>
<canvas id="c" width="340" height="420"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let px = 170, py = 350;

function draw() {
  ctx.fillStyle = '#0284c7';
  ctx.fillRect(0, 0, 340, 420);

  // Path
  ctx.fillStyle = '#f8fafc';
  ctx.fillRect(150, 50, 40, 320);

  // Hero
  ctx.fillStyle = '#ef4444';
  ctx.beginPath();
  ctx.arc(px, py, 12, 0, Math.PI*2);
  ctx.fill();
}
draw();
canvas.addEventListener('click', () => {
  py -= 40;
  if (py < 60) { alert("Level Complete!"); py = 350; }
  draw();
});
</script>
</body>
</html>
