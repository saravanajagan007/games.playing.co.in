<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jacks or Better Video Poker</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0c4a6e; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: #075985; border-bottom: 2px solid #0284c7; }
h1 { font-size: 1.15rem; color: #38bdf8; font-weight: 700; }
#hand { display: flex; gap: 8px; margin: 24px auto; }
.card { width: 56px; height: 86px; background: #f8fafc; color: #0f172a; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
.card.held { outline: 4px solid #facc15; transform: translateY(-8px); }
.held-tag { font-size: 0.7rem; color: #facc15; margin-top: 4px; visibility: hidden; }
.card.held .held-tag { visibility: visible; }
button { background: #0284c7; color: white; border: none; padding: 12px 28px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 1.1rem; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>🎰 JACKS OR BETTER</h1>
  <span>Credits: <span id="credits" style="color:#facc15;">100</span></span>
</header>
<div id="hand">
  <div class="card held" onclick="toggleHold(0)"><span>J♠</span><span class="held-tag">HELD</span></div>
  <div class="card held" onclick="toggleHold(1)"><span>J♥</span><span class="held-tag">HELD</span></div>
  <div class="card" onclick="toggleHold(2)"><span>4♣</span><span class="held-tag">HELD</span></div>
  <div class="card" onclick="toggleHold(3)"><span>8♦</span><span class="held-tag">HELD</span></div>
  <div class="card" onclick="toggleHold(4)"><span>K♠</span><span class="held-tag">HELD</span></div>
</div>
<button id="btn-draw">Draw Cards 🂠</button>
<script>
function toggleHold(idx) {
  const cards = document.querySelectorAll('.card');
  cards[idx].classList.toggle('held');
}

document.getElementById('btn-draw').onclick = function() {
  document.getElementById('credits').innerText = "110";
  alert("Winning Hand! Pair of Jacks pays 10 Credits!");
};
</script>
</body>
</html>
