<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>8-Ball Classic Billiards</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #4ade80; font-weight: 700; }
canvas { background: #166534; border: 12px solid #78350f; border-radius: 16px; margin: 16px auto; box-shadow: 0 10px 30px rgba(0,0,0,0.6); cursor: crosshair; }
</style>
</head>
<body>
<header>
  <h1>🎱 8-BALL BILLIARDS</h1>
  <span>Potted: <span id="potted" style="color:#facc15; font-weight:700;">0</span>/7</span>
</header>
<canvas id="c" width="440" height="250"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let cueBall = { x: 120, y: 125, vx: 0, vy: 0 };
let balls = [
  { x: 280, y: 125, col: '#ef4444' },
  { x: 300, y: 115, col: '#3b82f6' },
  { x: 300, y: 135, col: '#0f172a' }, // 8-ball
  { x: 320, y: 105, col: '#eab308' },
  { x: 320, y: 125, col: '#a855f7' },
  { x: 320, y: 145, col: '#f97316' }
];

function update() {
  cueBall.x += cueBall.vx;
  cueBall.y += cueBall.vy;
  cueBall.vx *= 0.98;
  cueBall.vy *= 0.98;

  if (cueBall.x < 15 || cueBall.x > 425) cueBall.vx = -cueBall.vx;
  if (cueBall.y < 15 || cueBall.y > 235) cueBall.vy = -cueBall.vy;

  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.fillStyle = '#166534';
  ctx.fillRect(0, 0, 440, 250);

  // Pockets
  ctx.fillStyle = '#0f172a';
  [[12,12],[220,8],[428,12],[12,238],[220,242],[428,238]].forEach(([px,py]) => {
    ctx.beginPath();
    ctx.arc(px, py, 16, 0, Math.PI*2);
    ctx.fill();
  });

  // Balls
  balls.forEach(b => {
    ctx.fillStyle = b.col;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 9, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.stroke();
  });

  // Cue ball
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath();
  ctx.arc(cueBall.x, cueBall.y, 9, 0, Math.PI*2);
  ctx.fill();
}

canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  const dx = (e.clientX - r.left) - cueBall.x;
  const dy = (e.clientY - r.top) - cueBall.y;
  cueBall.vx = dx * 0.1;
  cueBall.vy = dy * 0.1;
});
update();
</script>
</body>
</html>
