<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Classic Backgammon Board</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #fbbf24; font-weight: 700; }
#board { width: 440px; height: 300px; background: #78350f; border: 8px solid #451a03; border-radius: 12px; margin: 16px auto; display: flex; flex-direction: column; justify-content: space-between; padding: 10px; }
.half-board { display: flex; justify-content: space-around; width: 100%; height: 120px; }
.point { width: 26px; height: 100%; background: #b45309; clip-path: polygon(0% 0%, 100% 0%, 50% 100%); display: flex; flex-direction: column; align-items: center; cursor: pointer; }
.point.bot { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); flex-direction: column-reverse; }
.checker { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; margin: 1px 0; }
.checker.white { background: #f8fafc; }
.checker.black { background: #0f172a; border-color: #94a3b8; }
#dice-area { display: flex; gap: 10px; margin-top: 10px; }
button { background: #b45309; color: white; border: none; padding: 8px 20px; border-radius: 6px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>🎲 CLASSIC BACKGAMMON</h1>
  <span>Turn: White</span>
</header>
<div id="board">
  <div class="half-board">
    <div class="point"></div><div class="point"></div><div class="point"></div>
    <div class="point"></div><div class="point"></div><div class="point"></div>
  </div>
  <div class="half-board">
    <div class="point bot"><div class="checker white"></div><div class="checker white"></div></div>
    <div class="point bot"></div>
    <div class="point bot"><div class="checker black"></div></div>
    <div class="point bot"></div>
    <div class="point bot"></div>
    <div class="point bot"><div class="checker white"></div></div>
  </div>
</div>
<div id="dice-area">
  <button id="btn-roll">Roll Dice (3, 5)</button>
</div>
<script>
document.getElementById('btn-roll').onclick = function() {
  const d1 = Math.floor(Math.random()*6)+1;
  const d2 = Math.floor(Math.random()*6)+1;
  this.innerText = `Roll Dice (${d1}, ${d2})`;
};
</script>
</body>
</html>
