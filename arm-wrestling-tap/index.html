<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Arm Wrestling Tap</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #ef4444; font-weight: 700; }
canvas { background: #1e293b; border: 2px solid #334155; border-radius: 8px; margin: 16px auto; }
button { background: #ef4444; color: white; border: none; padding: 16px 36px; border-radius: 12px; font-weight: 900; font-size: 1.4rem; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>💪 ARM WRESTLING</h1>
  <span>Power Battle</span>
</header>
<canvas id="c" width="340" height="260"></canvas>
<button id="btn-mash">TAP FAST! 🔥</button>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let balance = 0; // -100 (loss) to +100 (win)

function update() {
  balance -= 0.35; // AI constant push
  if (balance <= -100) { alert("Pinned! AI wins the arm wrestle!"); balance = 0; }
  if (balance >= 100) { alert("PIN! You slammed the AI's arm down!"); balance = 0; }
  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(0, 0, 340, 260);

  // Table
  ctx.fillStyle = '#78350f';
  ctx.fillRect(30, 200, 280, 20);

  // Arms locked
  const angle = (balance * Math.PI) / 300;
  ctx.save();
  ctx.translate(170, 200);
  ctx.rotate(angle);
  ctx.strokeStyle = '#facc15';
  ctx.lineWidth = 14;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(0, -90);
  ctx.stroke();
  ctx.restore();
}

document.getElementById('btn-mash').onclick = () => { balance += 5; };
window.addEventListener('keydown', e => { if (e.code === 'Space') balance += 5; });
update();
</script>
</body>
</html>
