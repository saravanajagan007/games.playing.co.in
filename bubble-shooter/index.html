<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/embed-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Classic Bubble Pop Shooter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: monospace; color: #fff; }
    #canvas { background: #1e293b; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 12px; max-width: 95vw; max-height: 85vh; cursor: crosshair; }
    .hint { margin-top: 10px; color: #94a3b8; font-size: 13px; font-weight: bold; }
  </style>
</head>
<body>
  <canvas id="canvas" width="480" height="600"></canvas>
  <div class="hint">Aim with Mouse / Touch & Click to Shoot</div>
  <script>
    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(f, t, d) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.setValueAtTime(0.12, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + d);
      } catch(e) {}
    }
    const R = 18, COLS = 12, ROWS = 13;
    const COLORS = ['#ef4444', '#3b82f6', '#22c55e', '#eab308', '#a855f7'];
    let grid = [], bullet = null, nextColor = COLORS[0], score = 0, state = 'PLAY';
    function randCol() { return COLORS[Math.floor(Math.random() * COLORS.length)]; }

    function initGrid() {
      grid = [];
      for (let r = 0; r < 5; r++) {
        grid[r] = [];
        for (let c = 0; c < COLS; c++) grid[r][c] = randCol();
      }
      for (let r = 5; r < ROWS; r++) {
        grid[r] = [];
        for (let c = 0; c < COLS; c++) grid[r][c] = null;
      }
      nextColor = randCol();
      spawnBullet();
    }

    function spawnBullet() {
      bullet = { x: canvas.width / 2, y: canvas.height - 40, col: nextColor, vx: 0, vy: 0, moving: false };
      nextColor = randCol();
    }

    let aimAngle = -Math.PI / 2;

    function getGridPos(x, y) {
      let r = Math.floor(y / (R * 1.8));
      let c = Math.floor(x / (R * 2));
      return { r: Math.max(0, Math.min(ROWS - 1, r)), c: Math.max(0, Math.min(COLS - 1, c)) };
    }

    function shoot() {
      if (!bullet.moving && state === 'PLAY') {
        bullet.vx = Math.cos(aimAngle) * 11;
        bullet.vy = Math.sin(aimAngle) * 11;
        bullet.moving = true;
        beep(480, 'sine', 0.1);
      } else if (state === 'OVER') {
        score = 0; state = 'PLAY'; initGrid();
      }
    }

    function findMatches(startR, startC, col) {
      let matches = [], visited = {};
      let queue = [{ r: startR, c: startC }];
      visited[startR + ',' + startC] = true;
      while (queue.length > 0) {
        let { r, c } = queue.pop();
        matches.push({ r, c });
        const neighbors = [{ r: r - 1, c }, { r: r + 1, c }, { r, c: c - 1 }, { r, c: c + 1 }];
        neighbors.forEach(n => {
          let key = n.r + ',' + n.c;
          if (n.r >= 0 && n.r < ROWS && n.c >= 0 && n.c < COLS && !visited[key]) {
            if (grid[n.r][n.c] === col) {
              visited[key] = true;
              queue.push(n);
            }
          }
        });
      }
      return matches;
    }

    function snapBullet() {
      let pos = getGridPos(bullet.x, bullet.y);
      grid[pos.r][pos.c] = bullet.col;
      let matches = findMatches(pos.r, pos.c, bullet.col);
      if (matches.length >= 3) {
        matches.forEach(m => { grid[m.r][m.c] = null; });
        score += matches.length * 30;
        beep(740, 'triangle', 0.15);
      } else {
        beep(240, 'square', 0.08);
      }
      // Check game over
      for (let c = 0; c < COLS; c++) {
        if (grid[ROWS - 2][c] !== null) state = 'OVER';
      }
      spawnBullet();
    }

    function update() {
      if (bullet && bullet.moving && state === 'PLAY') {
        bullet.x += bullet.vx;
        bullet.y += bullet.vy;
        // Wall bounce
        if (bullet.x - R <= 0 || bullet.x + R >= canvas.width) {
          bullet.vx *= -1;
          beep(300, 'square', 0.04);
        }
        // Ceiling hit
        if (bullet.y - R <= 0) {
          snapBullet();
          return;
        }
        // Collision with other bubbles
        let pos = getGridPos(bullet.x, bullet.y);
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (grid[r][c] !== null) {
              let bx = c * R * 2 + R, by = r * R * 1.8 + R;
              let dist = Math.hypot(bullet.x - bx, bullet.y - by);
              if (dist < R * 1.8) {
                snapBullet();
                return;
              }
            }
          }
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // Grid
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c]) {
            let x = c * R * 2 + R, y = r * R * 1.8 + R;
            ctx.fillStyle = grid[r][c];
            ctx.beginPath(); ctx.arc(x, y, R - 1, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath(); ctx.arc(x - 4, y - 4, 4, 0, Math.PI * 2); ctx.fill();
          }
        }
      }
      // Shooter Base
      ctx.strokeStyle = '#475569'; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, canvas.height - 40);
      ctx.lineTo(canvas.width / 2 + Math.cos(aimAngle) * 50, canvas.height - 40 + Math.sin(aimAngle) * 50);
      ctx.stroke();

      // Current Bullet
      if (bullet) {
        ctx.fillStyle = bullet.col;
        ctx.beginPath(); ctx.arc(bullet.x, bullet.y, R - 1, 0, Math.PI * 2); ctx.fill();
      }
      // Next color preview
      ctx.fillStyle = nextColor;
      ctx.beginPath(); ctx.arc(60, canvas.height - 40, R - 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 12px monospace'; ctx.fillText('NEXT', 45, canvas.height - 15);

      // Score
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 18px monospace'; ctx.textAlign = 'right';
      ctx.fillText('SCORE: ' + score, canvas.width - 25, canvas.height - 35);

      if (state === 'OVER') {
        ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444'; ctx.font = 'bold 32px monospace'; ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
        ctx.fillStyle = '#cbd5e1'; ctx.font = '16px monospace';
        ctx.fillText('Tap or Click to Play Again', canvas.width / 2, canvas.height / 2 + 20);
      }
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }

    function trackAim(e) {
      let rect = canvas.getBoundingClientRect();
      let cx = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
      let cy = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
      aimAngle = Math.atan2(cy - (canvas.height - 40), cx - (canvas.width / 2));
      aimAngle = Math.min(-0.2, Math.max(-Math.PI + 0.2, aimAngle));
    }

    canvas.addEventListener('mousemove', trackAim);
    canvas.addEventListener('touchmove', trackAim, {passive: true});
    canvas.addEventListener('mousedown', shoot);
    canvas.addEventListener('touchend', shoot);

    initGrid(); loop();
  </script>
</body>
</html>
