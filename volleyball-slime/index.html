<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Slime Volleyball 2D</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #f59e0b; font-weight: 700; }
canvas { background: #38bdf8; border: 2px solid #334155; border-radius: 8px; margin: 16px auto; }
</style>
</head>
<body>
<header>
  <h1>🏐 SLIME VOLLEYBALL</h1>
  <span>Player: 0 | AI: 0</span>
</header>
<canvas id="c" width="400" height="260"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let ball = { x: 100, y: 100, vx: 2, vy: 0 };
let slimeX = 80;

function update() {
  ball.vy += 0.25;
  ball.x += ball.vx;
  ball.y += ball.vy;

  if (ball.x < 10 || ball.x > 390) ball.vx = -ball.vx;
  if (ball.y > 210) { ball.vy = -7; }

  // Bounce slime
  if (Math.hypot(ball.x - slimeX, ball.y - 210) < 35) {
    ball.vy = -8;
    ball.vx = 3;
  }

  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(0, 0, 400, 260);

  // Sand
  ctx.fillStyle = '#fde047';
  ctx.fillRect(0, 220, 400, 40);

  // Net
  ctx.fillStyle = '#fff';
  ctx.fillRect(198, 150, 4, 70);

  // Slime
  ctx.fillStyle = '#22c55e';
  ctx.beginPath();
  ctx.arc(slimeX, 220, 28, Math.PI, 0);
  ctx.fill();

  // Ball
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, 10, 0, Math.PI*2);
  ctx.fill();
}

window.addEventListener('keydown', e => {
  if (['ArrowLeft','KeyA'].includes(e.code) && slimeX > 30) slimeX -= 12;
  if (['ArrowRight','KeyD'].includes(e.code) && slimeX < 170) slimeX += 12;
});
update();
</script>
</body>
</html>
