<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mahjong Solitaire Classic</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #064e3b; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: #022c22; border-bottom: 2px solid #059669; }
h1 { font-size: 1.15rem; color: #34d399; font-weight: 700; }
#tile-board { display: grid; grid-template-columns: repeat(6, 52px); grid-template-rows: repeat(4, 68px); gap: 6px; margin: 24px auto; }
.tile { width: 52px; height: 68px; background: #fef08a; color: #0f172a; border-radius: 6px; border: 2px solid #eab308; box-shadow: 0 4px 8px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; font-size: 2rem; cursor: pointer; transition: transform 0.1s; }
.tile.selected { outline: 3px solid #38bdf8; transform: translateY(-6px); }
.tile.empty { visibility: hidden; }
button { background: #059669; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>🀄 MAHJONG SOLITAIRE</h1>
  <span>Pairs Left: <span id="pairs-left" style="color: #facc15;">12</span></span>
</header>
<div id="tile-board"></div>
<button id="btn-shuffle">Deal New Layout</button>
<script>
const ICONS = ["🀇","🀈","🀉","🀊","🀋","🀌","🀍","🀎","🀏","🀐","🀑","🀒"];
let tiles = [];
let selected = null;
let pairsLeft = 12;

function init() {
  tiles = [...ICONS, ...ICONS].sort(() => Math.random() - 0.5);
  selected = null;
  pairsLeft = 12;
  render();
}

function render() {
  const b = document.getElementById('tile-board');
  b.innerHTML = '';
  document.getElementById('pairs-left').innerText = pairsLeft;

  tiles.forEach((t, idx) => {
    const el = document.createElement('div');
    el.className = 'tile' + (t === null ? ' empty' : '');
    if (t !== null) {
      el.innerText = t;
      if (selected === idx) el.classList.add('selected');
      el.onclick = () => onTileClick(idx);
    }
    b.appendChild(el);
  });
}

function onTileClick(idx) {
  if (selected === null) {
    selected = idx;
    render();
  } else {
    if (selected === idx) {
      selected = null;
      render();
      return;
    }
    if (tiles[selected] === tiles[idx]) {
      tiles[selected] = null;
      tiles[idx] = null;
      selected = null;
      pairsLeft--;
      render();
      if (pairsLeft === 0) setTimeout(() => alert("Zen Harmony! All Mahjong tiles cleared!"), 150);
    } else {
      selected = null;
      render();
    }
  }
}

document.getElementById('btn-shuffle').onclick = init;
init();
</script>
</body>
</html>
