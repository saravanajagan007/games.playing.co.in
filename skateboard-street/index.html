<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Street Skateboard Ollie</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #f59e0b; font-weight: 700; }
canvas { background: #38bdf8; border: 2px solid #334155; border-radius: 8px; margin: 16px auto; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>🛹 SKATEBOARD OLLIE</h1>
  <span>Score: <span id="score" style="color:#facc15; font-weight:700;">0</span></span>
</header>
<canvas id="c" width="340" height="340"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let py = 250, vy = 0, onGround = true;
let score = 0;

function update() {
  vy += 0.4;
  py += vy;
  if (py >= 250) { py = 250; vy = 0; onGround = true; }
  score++;
  document.getElementById('score').innerText = Math.floor(score/10);

  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(0, 0, 340, 340);

  // Road
  ctx.fillStyle = '#334155';
  ctx.fillRect(0, 275, 340, 65);

  // Skateboard
  ctx.fillStyle = '#f59e0b';
  ctx.fillRect(60, py + 15, 45, 6);
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(70, py + 24, 4, 0, Math.PI*2);
  ctx.arc(95, py + 24, 4, 0, Math.PI*2);
  ctx.fill();
}

function ollie() {
  if (onGround) { vy = -8; onGround = false; }
}
canvas.addEventListener('click', ollie);
window.addEventListener('keydown', e => { if (e.code === 'Space') ollie(); });
update();
</script>
</body>
</html>
