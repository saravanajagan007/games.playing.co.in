<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Darts 501 Target</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #ef4444; font-weight: 700; }
canvas { background: #1e293b; border: 2px solid #334155; border-radius: 8px; margin: 16px auto; cursor: crosshair; }
</style>
</head>
<body>
<header>
  <h1>🎯 DARTS 501</h1>
  <span>Remaining: <span id="rem" style="color:#facc15; font-weight:700;">501</span></span>
</header>
<canvas id="c" width="340" height="380"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let remaining = 501;

function drawBoard() {
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(0, 0, 340, 380);

  // Outer board
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(170, 190, 140, 0, Math.PI*2);
  ctx.fill();

  // Bullseye
  ctx.fillStyle = '#ef4444';
  ctx.beginPath();
  ctx.arc(170, 190, 16, 0, Math.PI*2);
  ctx.fill();
}

canvas.addEventListener('click', () => {
  const pts = Math.floor(Math.random() * 40) + 15;
  remaining = Math.max(0, remaining - pts);
  document.getElementById('rem').innerText = remaining;
  if (remaining === 0) alert("Game Shot and Match! 501 cleared!");
});
drawBoard();
</script>
</body>
</html>
