<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ragdoll Sandbox</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #818cf8; font-weight: 700; }
canvas { background: #111827; border: 2px solid #4f46e5; border-radius: 8px; margin: 16px auto; cursor: grab; }
</style>
</head>
<body>
<header>
  <h1>🤸 RAGDOLL SANDBOX</h1>
  <span>Physics Lab</span>
</header>
<canvas id="c" width="340" height="420"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let rx = 170, ry = 150, vy = 0;
let isDragging = false;

function update() {
  if (!isDragging) {
    vy += 0.35;
    ry += vy;
    if (ry > 360) { ry = 360; vy = -vy * 0.5; }
  }
  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.fillStyle = '#111827';
  ctx.fillRect(0, 0, 340, 420);

  // Floor
  ctx.fillStyle = '#334155';
  ctx.fillRect(0, 390, 340, 30);

  // Ragdoll (head & body)
  ctx.fillStyle = '#818cf8';
  ctx.beginPath();
  ctx.arc(rx, ry - 30, 16, 0, Math.PI*2);
  ctx.fill();

  ctx.strokeStyle = '#818cf8';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(rx, ry - 14); ctx.lineTo(rx, ry + 20); // torso
  ctx.moveTo(rx - 20, ry); ctx.lineTo(rx + 20, ry); // arms
  ctx.moveTo(rx, ry + 20); ctx.lineTo(rx - 15, ry + 40); // legs
  ctx.moveTo(rx, ry + 20); ctx.lineTo(rx + 15, ry + 40);
  ctx.stroke();
}

canvas.addEventListener('mousedown', e => { isDragging = true; });
window.addEventListener('mousemove', e => {
  if (isDragging) {
    const r = canvas.getBoundingClientRect();
    rx = e.clientX - r.left;
    ry = e.clientY - r.top;
    vy = 0;
  }
});
window.addEventListener('mouseup', () => { isDragging = false; });
update();
</script>
</body>
</html>
