<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Retro Boxing Ring</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #ef4444; font-weight: 700; }
canvas { background: #0f172a; border: 4px solid #ef4444; border-radius: 8px; margin: 16px auto; }
#punch-bar { display: flex; gap: 12px; }
button { background: #ef4444; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>🥊 RETRO BOXING</h1>
  <span>Enemy HP: <span id="ehp" style="color:#facc15; font-weight:700;">100</span></span>
</header>
<canvas id="c" width="340" height="280"></canvas>
<div id="punch-bar">
  <button id="btn-jab">JAB 👊</button>
  <button id="btn-hook">HOOK 💥</button>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let enemyHP = 100;

function draw() {
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, 340, 280);

  // Ropes
  ctx.strokeStyle = '#ef4444';
  ctx.lineWidth = 3;
  ctx.strokeRect(30, 40, 280, 200);

  // Opponent boxer
  ctx.fillStyle = '#38bdf8';
  ctx.beginPath();
  ctx.arc(170, 110, 25, 0, Math.PI*2);
  ctx.fill();
  ctx.fillRect(145, 140, 50, 60);
}

function punch(dmg) {
  enemyHP = Math.max(0, enemyHP - dmg);
  document.getElementById('ehp').innerText = enemyHP;
  if (enemyHP === 0) {
    alert("KNOCKOUT! You win by KO!");
    enemyHP = 100;
    document.getElementById('ehp').innerText = enemyHP;
  }
}

document.getElementById('btn-jab').onclick = () => punch(10);
document.getElementById('btn-hook').onclick = () => punch(25);
draw();
</script>
</body>
</html>
