<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/embed-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nokia Snake 3310 Retro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #1c1917; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: monospace; }
    #canvas { background: #94a87b; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 8px solid #57534e; border-radius: 12px; max-width: 95vw; max-height: 85vh; }
    .hint { margin-top: 10px; color: #a8a29e; font-size: 13px; font-weight: bold; }
  </style>
</head>
<body>
  <canvas id="canvas" width="400" height="400"></canvas>
  <div class="hint">Arrow Keys or Swipe to Control Snake</div>
  <script>
    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(f, t, d, v=0.1) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.setValueAtTime(v, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + d);
      } catch(e) {}
    }
    
    const GRID = 16, COLS = 25, ROWS = 25;
    let snake = [{ x: 12, y: 12 }, { x: 11, y: 12 }, { x: 10, y: 12 }];
    let dir = { x: 1, y: 0 }, nextDir = { x: 1, y: 0 }, food = { x: 18, y: 12 }, score = 0, state = 'PLAY';
    function spawnFood() {
      food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      while (snake.some(s => s.x === food.x && s.y === food.y)) {
        food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      }
    }
    function step() {
      if (state !== 'PLAY') return;
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      // Wall collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS || snake.some(s => s.x === head.x && s.y === head.y)) {
        state = 'OVER'; beep(150, 'sawtooth', 0.3); return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10; beep(600, 'square', 0.08); spawnFood();
      } else {
        snake.pop();
      }
    }
    function draw() {
      ctx.fillStyle = '#94a87b'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      // Food
      ctx.fillStyle = '#1c2415';
      ctx.fillRect(food.x * GRID + 2, food.y * GRID + 2, GRID - 4, GRID - 4);
      // Snake
      snake.forEach((s, idx) => {
        ctx.fillStyle = '#1c2415';
        ctx.fillRect(s.x * GRID + 1, s.y * GRID + 1, GRID - 2, GRID - 2);
      });
      // Border frame
      ctx.strokeStyle = '#1c2415'; ctx.lineWidth = 4;
      ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);
      // HUD
      ctx.fillStyle = '#1c2415'; ctx.font = 'bold 16px monospace'; ctx.textAlign = 'left';
      ctx.fillText('SCORE: ' + score, 15, 24);
      if (state === 'OVER') {
        ctx.fillStyle = 'rgba(148, 168, 123, 0.9)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#1c2415'; ctx.font = 'bold 26px monospace'; ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 15);
        ctx.font = '14px monospace'; ctx.fillText('Score: ' + score + ' • Tap to Restart', canvas.width / 2, canvas.height / 2 + 15);
      }
    }
    setInterval(step, 110);
    function loop() { draw(); requestAnimationFrame(loop); }
    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowUp' && dir.y === 0) nextDir = { x: 0, y: -1 };
      else if (e.code === 'ArrowDown' && dir.y === 0) nextDir = { x: 0, y: 1 };
      else if (e.code === 'ArrowLeft' && dir.x === 0) nextDir = { x: -1, y: 0 };
      else if (e.code === 'ArrowRight' && dir.x === 0) nextDir = { x: 1, y: 0 };
      else if (e.code === 'Space' && state === 'OVER') { snake = [{ x: 12, y: 12 }, { x: 11, y: 12 }]; dir = { x: 1, y: 0 }; nextDir = { x: 1, y: 0 }; score = 0; state = 'PLAY'; }
    });
    let tx = 0, ty = 0;
    canvas.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; });
    canvas.addEventListener('touchend', e => {
      if (state === 'OVER') { snake = [{ x: 12, y: 12 }, { x: 11, y: 12 }]; dir = { x: 1, y: 0 }; nextDir = { x: 1, y: 0 }; score = 0; state = 'PLAY'; return; }
      let dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0 && dir.x === 0) nextDir = { x: 1, y: 0 };
        else if (dx < 0 && dir.x === 0) nextDir = { x: -1, y: 0 };
      } else {
        if (dy > 0 && dir.y === 0) nextDir = { x: 0, y: 1 };
        else if (dy < 0 && dir.y === 0) nextDir = { x: 0, y: -1 };
      }
    });
    loop();
  </script>
</body>
</html>
