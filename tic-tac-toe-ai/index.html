<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tic Tac Toe Impossible AI</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #a78bfa; font-weight: 700; }
#grid { display: grid; grid-template-columns: repeat(3, 90px); grid-template-rows: repeat(3, 90px); gap: 8px; margin: 24px auto; background: #1e293b; padding: 12px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
.cell { width: 90px; height: 90px; background: #0f172a; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 900; cursor: pointer; border: 2px solid #334155; }
.cell.X { color: #38bdf8; text-shadow: 0 0 15px rgba(56, 189, 248, 0.7); }
.cell.O { color: #f43f5e; text-shadow: 0 0 15px rgba(244, 63, 94, 0.7); }
button { background: #8b5cf6; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>❌ TIC TAC TOE AI</h1>
  <span>Player: <span style="color:#38bdf8;">X</span> | AI: <span style="color:#f43f5e;">O</span></span>
</header>
<div id="grid"></div>
<button id="btn-reset">New Round</button>
<script>
let board = Array(9).fill(null);
let gameOver = false;

function render() {
  const g = document.getElementById('grid');
  g.innerHTML = '';
  board.forEach((val, idx) => {
    const el = document.createElement('div');
    el.className = 'cell ' + (val || '');
    el.innerText = val || '';
    el.onclick = () => onCellClick(idx);
    g.appendChild(el);
  });
}

function onCellClick(idx) {
  if (board[idx] || gameOver) return;
  board[idx] = 'X';
  render();
  if (checkWinner('X')) {
    gameOver = true;
    setTimeout(() => alert("Victory! You bested the Minimax!"), 150);
    return;
  }
  if (!board.includes(null)) {
    gameOver = true;
    setTimeout(() => alert("Stalemate! An honorable tie against the AI!"), 150);
    return;
  }
  setTimeout(aiMove, 250);
}

function checkWinner(p, b = board) {
  const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  return wins.some(([x,y,z]) => b[x] === p && b[y] === p && b[z] === p);
}

function minimax(newBoard, isMax) {
  if (checkWinner('O', newBoard)) return { score: 10 };
  if (checkWinner('X', newBoard)) return { score: -10 };
  if (!newBoard.includes(null)) return { score: 0 };

  const moves = [];
  for (let i=0; i<9; i++) {
    if (newBoard[i] === null) {
      newBoard[i] = isMax ? 'O' : 'X';
      const result = minimax(newBoard, !isMax);
      moves.push({ index: i, score: result.score });
      newBoard[i] = null;
    }
  }

  let bestMove;
  if (isMax) {
    let bestScore = -1000;
    moves.forEach(m => { if (m.score > bestScore) { bestScore = m.score; bestMove = m; } });
  } else {
    let bestScore = 1000;
    moves.forEach(m => { if (m.score < bestScore) { bestScore = m.score; bestMove = m; } });
  }
  return bestMove;
}

function aiMove() {
  const best = minimax(board, true);
  board[best.index] = 'O';
  render();
  if (checkWinner('O')) {
    gameOver = true;
    setTimeout(() => alert("AI Wins! The machine is unbeatable."), 150);
  } else if (!board.includes(null)) {
    gameOver = true;
    setTimeout(() => alert("Stalemate! A hard-fought draw."), 150);
  }
}

document.getElementById('btn-reset').onclick = () => {
  board = Array(9).fill(null);
  gameOver = false;
  render();
};

render();
</script>
</body>
</html>
