<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Slope Tunnel Rush</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #22d3ee; font-weight: 700; }
canvas { background: #09090b; border: 2px solid #06b6d4; border-radius: 8px; margin: 16px auto; }
</style>
</head>
<body>
<header>
  <h1>⚡ NEON SLOPE RUSH</h1>
  <span>Dist: <span id="dist" style="color:#22d3ee; font-weight:700;">0m</span></span>
</header>
<canvas id="c" width="340" height="440"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let ballX = 170, vx = 0;
let dist = 0;

function update() {
  ballX += vx;
  dist += 1;
  document.getElementById('dist').innerText = dist + "m";
  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.fillStyle = '#09090b';
  ctx.fillRect(0, 0, 340, 440);

  // Perspective slope
  ctx.strokeStyle = '#06b6d4';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(120, 100); ctx.lineTo(30, 440);
  ctx.moveTo(220, 100); ctx.lineTo(310, 440);
  ctx.stroke();

  // Ball
  ctx.fillStyle = '#22d3ee';
  ctx.beginPath();
  ctx.arc(ballX, 360, 14, 0, Math.PI*2);
  ctx.fill();
}

window.addEventListener('keydown', e => {
  if (['ArrowLeft','KeyA'].includes(e.code)) vx = -4;
  if (['ArrowRight','KeyD'].includes(e.code)) vx = 4;
});
window.addEventListener('keyup', () => { vx = 0; });
update();
</script>
</body>
</html>
