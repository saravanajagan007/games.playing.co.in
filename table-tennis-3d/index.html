<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Table Tennis Showdown</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #38bdf8; font-weight: 700; }
canvas { background: #0369a1; border: 4px solid #fff; border-radius: 8px; margin: 16px auto; cursor: none; }
</style>
</head>
<body>
<header>
  <h1>🏓 PING PONG SHOWDOWN</h1>
  <span>Rally: <span id="rally" style="color:#facc15; font-weight:700;">0</span></span>
</header>
<canvas id="c" width="340" height="420"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let ball = { x: 170, y: 210, vx: 2, vy: 4 };
let paddleX = 170;
let rally = 0;

function update() {
  ball.x += ball.vx;
  ball.y += ball.vy;

  if (ball.x < 10 || ball.x > 330) ball.vx = -ball.vx;
  if (ball.y < 30) ball.vy = -ball.vy;

  // Paddle return
  if (ball.y > 380 && ball.y < 400 && Math.abs(ball.x - paddleX) < 40) {
    ball.vy = -ball.vy;
    rally++;
    document.getElementById('rally').innerText = rally;
  }

  if (ball.y > 420) {
    alert("Missed! Final rally: " + rally);
    ball = { x: 170, y: 210, vx: 2, vy: 4 };
    rally = 0;
    document.getElementById('rally').innerText = rally;
  }

  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.fillStyle = '#0369a1';
  ctx.fillRect(0, 0, 340, 420);

  // Net
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, 180); ctx.lineTo(340, 180);
  ctx.stroke();

  // Paddle
  ctx.fillStyle = '#ef4444';
  ctx.fillRect(paddleX - 35, 390, 70, 12);

  // Ball
  ctx.fillStyle = '#facc15';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, 8, 0, Math.PI*2);
  ctx.fill();
}

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  paddleX = e.clientX - r.left;
});
update();
</script>
</body>
</html>
