<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shuffleboard Table</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #fbbf24; font-weight: 700; }
canvas { background: #fef3c7; border: 8px solid #78350f; border-radius: 8px; margin: 16px auto; cursor: crosshair; }
</style>
</head>
<body>
<header>
  <h1>🎯 SHUFFLEBOARD</h1>
  <span>Score: <span id="score" style="color:#fbbf24; font-weight:700;">0</span></span>
</header>
<canvas id="c" width="300" height="420"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let puckY = 380, vy = 0;

function update() {
  puckY += vy;
  vy *= 0.97;
  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.fillStyle = '#fef3c7';
  ctx.fillRect(0, 0, 300, 420);

  // Score lines
  ctx.strokeStyle = '#b45309';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, 80); ctx.lineTo(300, 80); // 3 pts
  ctx.moveTo(0, 160); ctx.lineTo(300, 160); // 2 pts
  ctx.moveTo(0, 240); ctx.lineTo(300, 240); // 1 pt
  ctx.stroke();

  // Puck
  ctx.fillStyle = '#ef4444';
  ctx.beginPath();
  ctx.arc(150, puckY, 14, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.stroke();
}

canvas.addEventListener('click', () => { vy = -7; });
update();
</script>
</body>
</html>
