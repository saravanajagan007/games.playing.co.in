<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jewel Rush Match 3 Cascade</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #c084fc; font-weight: 700; }
#grid-box { margin: 16px auto; background: #111827; padding: 12px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 2px solid #334155; }
#board { display: grid; grid-template-columns: repeat(8, 42px); grid-template-rows: repeat(8, 42px); gap: 4px; }
.gem { width: 42px; height: 42px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; cursor: pointer; transition: transform 0.1s, box-shadow 0.15s; background: #1e293b; }
.gem.selected { transform: scale(1.15); box-shadow: 0 0 12px #fff; border: 2px solid #fff; z-index: 10; }
.gem:active { transform: scale(0.95); }
button { background: #9333ea; color: white; border: none; padding: 8px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>💎 JEWEL RUSH</h1>
  <div style="font-size: 0.95rem; font-weight: 600;">
    Score: <span id="score" style="color: #facc15;">0</span>
  </div>
</header>
<div id="grid-box">
  <div id="board"></div>
</div>
<button id="btn-shuffle">New Game</button>
<script>
const GEMS = ["💎", "🔮", "⭐", "🔴", "🍀", "🔶"];
const R = 8, C = 8;
let board = [];
let selected = null;
let score = 0;

function init() {
  score = 0;
  document.getElementById('score').innerText = score;
  board = [];
  for (let r=0; r<R; r++) {
    const row = [];
    for (let c=0; c<C; c++) {
      row.push(GEMS[Math.floor(Math.random() * GEMS.length)]);
    }
    board.push(row);
  }
  eliminateMatches();
  render();
}

function render() {
  const b = document.getElementById('board');
  b.innerHTML = '';
  document.getElementById('score').innerText = score;

  for (let r=0; r<R; r++) {
    for (let c=0; c<C; c++) {
      const gem = document.createElement('div');
      gem.className = 'gem';
      if (selected && selected.r === r && selected.c === c) gem.classList.add('selected');
      gem.innerText = board[r][c];
      gem.onclick = () => onGemClick(r, c);
      b.appendChild(gem);
    }
  }
}

function onGemClick(r, c) {
  if (!selected) {
    selected = { r, c };
    render();
    return;
  }
  // Check adjacent
  const dr = Math.abs(selected.r - r);
  const dc = Math.abs(selected.c - c);
  if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
    // Swap
    const tmp = board[selected.r][selected.c];
    board[selected.r][selected.c] = board[r][c];
    board[r][c] = tmp;
    selected = null;
    if (!checkMatches()) {
      // Revert if no match
      const t = board[r][c];
      board[r][c] = board[r - (r-dr)][c - (c-dc)]; // simple revert
      setTimeout(render, 150);
    } else {
      eliminateMatches();
    }
  } else {
    selected = { r, c };
    render();
  }
}

function checkMatches() {
  let hasMatch = false;
  // horizontal
  for (let r=0; r<R; r++) {
    for (let c=0; c<C-2; c++) {
      if (board[r][c] && board[r][c] === board[r][c+1] && board[r][c] === board[r][c+2]) hasMatch = true;
    }
  }
  // vertical
  for (let r=0; r<R-2; r++) {
    for (let c=0; c<C; c++) {
      if (board[r][c] && board[r][c] === board[r+1][c] && board[r][c] === board[r+2][c]) hasMatch = true;
    }
  }
  return hasMatch;
}

function eliminateMatches() {
  let toRemove = Array(R).fill(null).map(() => Array(C).fill(false));
  for (let r=0; r<R; r++) {
    for (let c=0; c<C-2; c++) {
      if (board[r][c] && board[r][c] === board[r][c+1] && board[r][c] === board[r][c+2]) {
        toRemove[r][c] = true; toRemove[r][c+1] = true; toRemove[r][c+2] = true;
      }
    }
  }
  for (let r=0; r<R-2; r++) {
    for (let c=0; c<C; c++) {
      if (board[r][c] && board[r][c] === board[r+1][c] && board[r][c] === board[r+2][c]) {
        toRemove[r][c] = true; toRemove[r+1][c] = true; toRemove[r+2][c] = true;
      }
    }
  }

  let count = 0;
  for (let r=0; r<R; r++) {
    for (let c=0; c<C; c++) {
      if (toRemove[r][c]) {
        board[r][c] = GEMS[Math.floor(Math.random() * GEMS.length)];
        count++;
      }
    }
  }
  if (count > 0) {
    score += count * 10;
    render();
  }
}

document.getElementById('btn-shuffle').onclick = init;
init();
</script>
</body>
</html>
