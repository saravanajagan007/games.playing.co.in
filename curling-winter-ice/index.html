<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Winter Ice Curling</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #38bdf8; font-weight: 700; }
canvas { background: #e0f2fe; border: 4px solid #0284c7; border-radius: 8px; margin: 16px auto; cursor: crosshair; }
</style>
</head>
<body>
<header>
  <h1>🥌 WINTER CURLING</h1>
  <span>Stone Distance</span>
</header>
<canvas id="c" width="300" height="440"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let stone = { x: 150, y: 390, vy: 0 };

function update() {
  stone.y += stone.vy;
  stone.vy *= 0.98;
  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.fillStyle = '#e0f2fe';
  ctx.fillRect(0, 0, 300, 440);

  // The House (Target)
  ctx.fillStyle = '#0284c7';
  ctx.beginPath(); ctx.arc(150, 100, 60, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(150, 100, 40, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ef4444';
  ctx.beginPath(); ctx.arc(150, 100, 20, 0, Math.PI*2); ctx.fill();

  // Granite Stone
  ctx.fillStyle = '#475569';
  ctx.beginPath();
  ctx.arc(stone.x, stone.y, 16, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#eab308';
  ctx.fillRect(stone.x - 4, stone.y - 12, 8, 24); // handle
}

canvas.addEventListener('click', () => { stone.vy = -6; });
update();
</script>
</body>
</html>
