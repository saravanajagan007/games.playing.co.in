<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Water Sort Color Tubes</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #38bdf8; font-weight: 700; }
#tubes-container { display: flex; gap: 18px; margin: 30px auto; }
.tube { width: 55px; height: 180px; border: 3px solid #64748b; border-top: none; border-radius: 0 0 25px 25px; display: flex; flex-direction: column-reverse; overflow: hidden; cursor: pointer; transition: transform 0.2s; background: rgba(255,255,255,0.05); }
.tube.selected { transform: translateY(-16px); border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); }
.layer { width: 100%; height: 42px; transition: height 0.2s; }
button { background: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>🧪 WATER SORT</h1>
  <span>Moves: <span id="moves" style="color: #facc15;">0</span></span>
</header>
<div id="tubes-container"></div>
<button id="btn-restart">Restart Tubes</button>
<script>
const COLORS = ["#ef4444", "#3b82f6", "#22c55e", "#eab308"];
let tubes = [
  ["#ef4444", "#3b82f6", "#ef4444", "#22c55e"],
  ["#3b82f6", "#22c55e", "#eab308", "#eab308"],
  ["#22c55e", "#ef4444", "#3b82f6", "#ef4444"],
  ["#eab308", "#3b82f6", "#22c55e", "#eab308"],
  [], []
];
let selected = null;
let moves = 0;

function render() {
  const c = document.getElementById('tubes-container');
  c.innerHTML = '';
  document.getElementById('moves').innerText = moves;

  tubes.forEach((t, idx) => {
    const tubeEl = document.createElement('div');
    tubeEl.className = 'tube' + (selected === idx ? ' selected' : '');
    t.forEach(col => {
      const layer = document.createElement('div');
      layer.className = 'layer';
      layer.style.background = col;
      tubeEl.appendChild(layer);
    });
    tubeEl.onclick = () => onTubeClick(idx);
    c.appendChild(tubeEl);
  });
}

function onTubeClick(idx) {
  if (selected === null) {
    if (tubes[idx].length > 0) {
      selected = idx;
      render();
    }
  } else {
    if (selected === idx) {
      selected = null;
      render();
      return;
    }
    const src = tubes[selected];
    const dst = tubes[idx];
    if (dst.length < 4) {
      const topColor = src[src.length - 1];
      if (dst.length === 0 || dst[dst.length - 1] === topColor) {
        dst.push(src.pop());
        moves++;
        selected = null;
        render();
        checkWin();
        return;
      }
    }
    selected = null;
    render();
  }
}

function checkWin() {
  let solved = true;
  tubes.forEach(t => {
    if (t.length > 0) {
      if (t.length !== 4) solved = false;
      else if (!t.every(c => c === t[0])) solved = false;
    }
  });
  if (solved) {
    setTimeout(() => alert("Victory! Pure color harmony achieved in " + moves + " moves!"), 150);
  }
}

document.getElementById('btn-restart').onclick = () => {
  tubes = [
    ["#ef4444", "#3b82f6", "#ef4444", "#22c55e"],
    ["#3b82f6", "#22c55e", "#eab308", "#eab308"],
    ["#22c55e", "#ef4444", "#3b82f6", "#ef4444"],
    ["#eab308", "#3b82f6", "#22c55e", "#eab308"],
    [], []
  ];
  selected = null;
  moves = 0;
  render();
};

render();
</script>
</body>
</html>
