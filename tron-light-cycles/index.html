<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/embed-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tron Neon Light Rider</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #030712; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: monospace; color: #fff; }
    #canvas { background: #000; box-shadow: 0 10px 40px rgba(6,182,212,0.3); border: 2px solid #06b6d4; border-radius: 12px; max-width: 95vw; max-height: 85vh; }
    .hint { margin-top: 10px; color: #94a3b8; font-size: 13px; font-weight: bold; }
  </style>
</head>
<body>
  <canvas id="canvas" width="600" height="450"></canvas>
  <div class="hint">Arrow Keys or Swipe to Steer • Trap the Enemy AI Cycle</div>
  <script>
    const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');
    
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(f, t, d, v=0.1) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.setValueAtTime(v, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + d);
      } catch(e) {}
    }
    
    const GRID = 5, COLS = 120, ROWS = 90;
    let grid = [], p1 = { x: 20, y: 45, dx: 1, dy: 0, col: '#06b6d4' };
    let ai = { x: 100, y: 45, dx: -1, dy: 0, col: '#f43f5e' };
    let state = 'PLAY', score = 0;
    function reset() {
      grid = Array(ROWS).fill(0).map(() => Array(COLS).fill(0));
      p1 = { x: 20, y: 45, dx: 1, dy: 0, col: '#06b6d4' };
      ai = { x: 100, y: 45, dx: -1, dy: 0, col: '#f43f5e' };
      state = 'PLAY';
    }
    function step() {
      if (state !== 'PLAY') return;
      // P1 step
      grid[p1.y][p1.x] = 1;
      p1.x += p1.dx; p1.y += p1.dy;
      if (p1.x < 0 || p1.x >= COLS || p1.y < 0 || p1.y >= ROWS || grid[p1.y][p1.x] !== 0) {
        state = 'AI_WIN'; beep(140, 'sawtooth', 0.4); return;
      }
      // Simple smart AI
      let nextX = ai.x + ai.dx, nextY = ai.y + ai.dy;
      if (nextX < 0 || nextX >= COLS || nextY < 0 || nextY >= ROWS || grid[nextY][nextX] !== 0) {
        // Pick safe turn
        let turns = ai.dx !== 0 ? [{ dx: 0, dy: 1 }, { dx: 0, dy: -1 }] : [{ dx: 1, dy: 0 }, { dx: -1, dy: 0 }];
        let safe = turns.find(t => {
          let tx = ai.x + t.dx, ty = ai.y + t.dy;
          return tx >= 0 && tx < COLS && ty >= 0 && ty < ROWS && grid[ty][tx] === 0;
        });
        if (safe) { ai.dx = safe.dx; ai.dy = safe.dy; }
      }
      grid[ai.y][ai.x] = 2;
      ai.x += ai.dx; ai.y += ai.dy;
      if (ai.x < 0 || ai.x >= COLS || ai.y < 0 || ai.y >= ROWS || grid[ai.y][ai.x] !== 0) {
        state = 'P1_WIN'; score++; beep(640, 'sine', 0.3); return;
      }
    }
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // Grid lines
      ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 30) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
      for (let y = 0; y < canvas.height; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
      // Trails
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c] === 1) { ctx.fillStyle = '#06b6d4'; ctx.fillRect(c * GRID, r * GRID, GRID, GRID); }
          else if (grid[r][c] === 2) { ctx.fillStyle = '#f43f5e'; ctx.fillRect(c * GRID, r * GRID, GRID, GRID); }
        }
      }
      // Heads
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(p1.x * GRID - 1, p1.y * GRID - 1, GRID + 2, GRID + 2);
      ctx.fillRect(ai.x * GRID - 1, ai.y * GRID - 1, GRID + 2, GRID + 2);

      // Score
      ctx.fillStyle = '#06b6d4'; ctx.font = 'bold 16px monospace'; ctx.fillText('CYBER SCORE: ' + score, 20, 30);

      if (state !== 'PLAY') {
        ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = 'bold 30px monospace'; ctx.textAlign = 'center';
        if (state === 'P1_WIN') { ctx.fillStyle = '#06b6d4'; ctx.fillText('PLAYER WINS ROUND!', canvas.width / 2, canvas.height / 2 - 15); }
        else { ctx.fillStyle = '#f43f5e'; ctx.fillText('AI DEREZZED YOU!', canvas.width / 2, canvas.height / 2 - 15); }
        ctx.font = '16px monospace'; ctx.fillStyle = '#cbd5e1'; ctx.fillText('Tap or Press Space for Next Round', canvas.width / 2, canvas.height / 2 + 25);
      }
    }
    setInterval(step, 45);
    function loop() { draw(); requestAnimationFrame(loop); }
    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowUp' && p1.dy === 0) { p1.dx = 0; p1.dy = -1; }
      else if (e.code === 'ArrowDown' && p1.dy === 0) { p1.dx = 0; p1.dy = 1; }
      else if (e.code === 'ArrowLeft' && p1.dx === 0) { p1.dx = -1; p1.dy = 0; }
      else if (e.code === 'ArrowRight' && p1.dx === 0) { p1.dx = 1; p1.dy = 0; }
      else if (e.code === 'Space' && state !== 'PLAY') reset();
    });
    let tx = 0, ty = 0;
    canvas.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; });
    canvas.addEventListener('touchend', e => {
      if (state !== 'PLAY') { reset(); return; }
      let dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0 && p1.dx === 0) { p1.dx = 1; p1.dy = 0; }
        else if (dx < 0 && p1.dx === 0) { p1.dx = -1; p1.dy = 0; }
      } else {
        if (dy > 0 && p1.dy === 0) { p1.dx = 0; p1.dy = 1; }
        else if (dy < 0 && p1.dy === 0) { p1.dx = 0; p1.dy = -1; }
      }
    });
    reset(); loop();
  </script>
</body>
</html>
