<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snowboard Alpine Slalom</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #38bdf8; font-weight: 700; }
canvas { background: #f0fdf4; border: 2px solid #38bdf8; border-radius: 8px; margin: 16px auto; }
</style>
</head>
<body>
<header>
  <h1>🏂 ALPINE SLALOM</h1>
  <span>Time: <span id="tm" style="color:#0284c7; font-weight:700;">0.0s</span></span>
</header>
<canvas id="c" width="340" height="420"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let bx = 170, vx = 0;
let time = 0;

function update() {
  bx += vx;
  time += 0.05;
  document.getElementById('tm').innerText = time.toFixed(1) + "s";
  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.fillStyle = '#f8fafc';
  ctx.fillRect(0, 0, 340, 420);

  // Pine trees
  ctx.fillStyle = '#166534';
  [[40, 100], [280, 150], [50, 260], [290, 320]].forEach(([tx, ty]) => {
    ctx.beginPath();
    ctx.moveTo(tx, ty); ctx.lineTo(tx - 15, ty + 30); ctx.lineTo(tx + 15, ty + 30);
    ctx.closePath();
    ctx.fill();
  });

  // Snowboarder
  ctx.fillStyle = '#ef4444';
  ctx.fillRect(bx - 12, 340, 24, 8); // board
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(bx, 330, 8, 0, Math.PI*2);
  ctx.fill();
}

window.addEventListener('keydown', e => {
  if (['ArrowLeft','KeyA'].includes(e.code)) vx = -4;
  if (['ArrowRight','KeyD'].includes(e.code)) vx = 4;
});
window.addEventListener('keyup', () => { vx = 0; });
update();
</script>
</body>
</html>
