<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy Propeller Plane</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #60a5fa; font-weight: 700; }
canvas { background: #38bdf8; border: 2px solid #334155; border-radius: 8px; margin: 16px auto; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>🛩️ FLAPPY PLANE</h1>
  <span>Score: <span id="score" style="color:#60a5fa; font-weight:700;">0</span></span>
</header>
<canvas id="c" width="340" height="440"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let py = 200, vy = 0;
let score = 0;

function update() {
  vy += 0.28;
  py += vy;
  if (py > 420 || py < 10) {
    alert("Crashed! Score: " + score);
    py = 200; vy = 0; score = 0;
  }
  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(0, 0, 340, 440);

  // Plane
  ctx.fillStyle = '#dc2626';
  ctx.fillRect(70, py, 36, 18);
  ctx.fillStyle = '#f8fafc';
  ctx.fillRect(80, py - 6, 12, 6); // wing
}

function flap() { vy = -6; score++; document.getElementById('score').innerText = score; }
canvas.addEventListener('click', flap);
window.addEventListener('keydown', e => { if (e.code === 'Space') flap(); });
update();
</script>
</body>
</html>
