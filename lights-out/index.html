<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lights Out Logic Matrix</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #090d16; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
#header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: #131c2e; border-bottom: 2px solid #1e293b; }
h1 { font-size: 1.2rem; font-weight: 700; color: #fbbf24; }
.stats { display: flex; gap: 14px; font-size: 0.95rem; font-weight: 600; }
.stat-val { color: #38bdf8; }
#grid-box { margin: 24px auto; background: #0f172a; padding: 16px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 2px solid #334155; }
#board { display: grid; grid-template-columns: repeat(5, 60px); grid-template-rows: repeat(5, 60px); gap: 10px; }
.tile { background: #1e293b; border-radius: 10px; border: 2px solid #334155; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
.tile.on { background: radial-gradient(circle, #fde047 20%, #eab308 90%); border-color: #facc15; box-shadow: 0 0 18px rgba(250, 204, 21, 0.7); transform: scale(0.96); }
#btn-bar { display: flex; gap: 12px; margin-top: 10px; }
button { background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }
button:hover { background: #1d4ed8; }
</style>
</head>
<body>
<div id="header">
  <h1>💡 Lights Out Matrix</h1>
  <div class="stats">
    <span>Moves: <span id="moves" class="stat-val">0</span></span>
    <span>Lights On: <span id="on-count" class="stat-val">0</span></span>
  </div>
</div>
<div id="grid-box">
  <div id="board"></div>
</div>
<div id="btn-bar">
  <button id="btn-new">New Puzzle</button>
  <button id="btn-reset">Reset</button>
</div>
<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playBeep(f) {
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.frequency.value = f;
    g.gain.setValueAtTime(0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.08);
  } catch(e) {}
}

const N = 5;
let board = Array(N).fill(null).map(() => Array(N).fill(false));
let startBoard = [];
let moves = 0;
const boardEl = document.getElementById('board');

function render() {
  boardEl.innerHTML = '';
  let count = 0;
  for (let r=0; r<N; r++) {
    for (let c=0; c<N; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile' + (board[r][c] ? ' on' : '');
      if (board[r][c]) count++;
      tile.onclick = () => clickTile(r, c);
      boardEl.appendChild(tile);
    }
  }
  document.getElementById('moves').innerText = moves;
  document.getElementById('on-count').innerText = count;
  if (count === 0 && moves > 0) {
    playBeep(600); setTimeout(() => playBeep(800), 100);
    setTimeout(() => alert("Victory! You extinguished all lights in " + moves + " moves!"), 200);
  }
}

function toggle(r, c) {
  if (r >= 0 && r < N && c >= 0 && c < N) {
    board[r][c] = !board[r][c];
  }
}

function clickTile(r, c) {
  moves++;
  playBeep(450);
  toggle(r, c);
  toggle(r-1, c);
  toggle(r+1, c);
  toggle(r, c-1);
  toggle(r, c+1);
  render();
}

function newPuzzle() {
  moves = 0;
  board = Array(N).fill(null).map(() => Array(N).fill(false));
  // Generate guaranteed solvable puzzle
  const steps = 7 + Math.floor(Math.random() * 5);
  for (let i=0; i<steps; i++) {
    const r = Math.floor(Math.random() * N);
    const c = Math.floor(Math.random() * N);
    toggle(r, c);
    toggle(r-1, c);
    toggle(r+1, c);
    toggle(r, c-1);
    toggle(r, c+1);
  }
  startBoard = board.map(row => [...row]);
  render();
}

function resetPuzzle() {
  moves = 0;
  board = startBoard.map(row => [...row]);
  render();
}

document.getElementById('btn-new').onclick = newPuzzle;
document.getElementById('btn-reset').onclick = resetPuzzle;
newPuzzle();
</script>
</body>
</html>
