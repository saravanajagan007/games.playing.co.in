<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bouncing Balls Chain</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #f472b6; font-weight: 700; }
canvas { background: #111827; border: 2px solid #ec4899; border-radius: 8px; margin: 16px auto; cursor: crosshair; }
</style>
</head>
<body>
<header>
  <h1>⚪ BALL CHAIN BREAKER</h1>
  <span>Round: <span id="rnd" style="color:#f472b6; font-weight:700;">1</span></span>
</header>
<canvas id="c" width="340" height="440"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let ball = { x: 170, y: 410, vx: 0, vy: 0, active: false };
let bricks = [
  { x: 50, y: 80, val: 5 }, { x: 120, y: 80, val: 5 }, { x: 190, y: 80, val: 5 }, { x: 260, y: 80, val: 5 }
];

function update() {
  if (ball.active) {
    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.x < 10 || ball.x > 330) ball.vx = -ball.vx;
    if (ball.y < 10) ball.vy = -ball.vy;
    if (ball.y > 430) { ball.active = false; ball.x = 170; ball.y = 410; }

    bricks.forEach(b => {
      if (b.val > 0 && ball.x > b.x && ball.x < b.x + 45 && ball.y > b.y && ball.y < b.y + 35) {
        b.val--;
        ball.vy = -ball.vy;
      }
    });
  }
  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.fillStyle = '#111827';
  ctx.fillRect(0, 0, 340, 440);

  // Bricks
  bricks.forEach(b => {
    if (b.val > 0) {
      ctx.fillStyle = '#ec4899';
      ctx.fillRect(b.x, b.y, 45, 35);
      ctx.fillStyle = '#fff';
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(b.val, b.x + 22, b.y + 22);
    }
  });

  // Ball
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, 8, 0, Math.PI*2);
  ctx.fill();
}

canvas.addEventListener('click', e => {
  if (!ball.active) {
    const r = canvas.getBoundingClientRect();
    const dx = (e.clientX - r.left) - ball.x;
    const dy = (e.clientY - r.top) - ball.y;
    const angle = Math.atan2(dy, dx);
    ball.vx = Math.cos(angle) * 7;
    ball.vy = Math.sin(angle) * 7;
    ball.active = true;
  }
});
update();
</script>
</body>
</html>
