<template id="html-human">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Connect Four</title>
<style>
  :root{
    --cols: 7;
    --rows: 6;
    --cell-size: min(12vw, 70px);
    --p1: #e74c3c;  /* rot */
    --p2: #f1c40f;  /* gelb */
    --empty: #1e90ff; /* blaues Brett */
    --bg: #0e1116;
    --text: #fff;
  }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1rem;
    margin:1.2rem;
  }
  h1{ margin:0.4rem 0; font-size:1.2rem; }
  #status{ min-height:1.4rem; }
  #board{
    display:grid;
    grid-template-columns: repeat(var(--cols), var(--cell-size));
    grid-auto-rows: var(--cell-size);
    gap:6px;
    padding:10px;
    background:#145eaa;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,0.35);
    touch-action: manipulation; /* mobile-friendly */
  }
  .cell{
    width: var(--cell-size);
    height: var(--cell-size);
    background: var(--empty);
    border-radius:10px;
    position:relative;
    cursor:pointer;
  }
  .disc{
    position:absolute;
    inset:8%;
    border-radius:50%;
    background:#0b2a4d;
    transition: transform 120ms ease;
  }
  .p1 .disc{ background: var(--p1); }
  .p2 .disc{ background: var(--p2); }
  .win .disc{
    outline:4px solid #2ecc71;
    transform: scale(1.05);
  }
  button{
    background:#2d2f36;
    color:#fff;
    border:none;
    padding:0.6rem 1rem;
    border-radius:8px;
    cursor:pointer;
  }
  button:hover{ filter:brightness(1.1); }
  footer{
    opacity:0.6; font-size:0.8rem; margin-top:0.5rem;
  }
</style>
</head>
<body>
  <h1>Connect Four</h1>
  <div id="status"></div>
  <div id="board" aria-label="Game board"></div>
  <button id="restart">Restart</button>
  <footer>Single-file HTML • No dependencies</footer>

<script>
(() => {
  const ROWS = 6, COLS = 7;
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const restartBtn = document.getElementById('restart');

  let board, currentPlayer, gameOver;

  function init(){
    document.documentElement.style.setProperty('--cols', COLS);
    document.documentElement.style.setProperty('--rows', ROWS);

    board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
    currentPlayer = 1;
    gameOver = false;

    boardEl.innerHTML = "";
    for(let r = 0; r < ROWS; r++){
      for(let c = 0; c < COLS; c++){
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.row = r;
        cell.dataset.col = c;
        const disc = document.createElement('div');
        disc.className = 'disc';
        cell.appendChild(disc);
        boardEl.appendChild(cell);
      }
    }
    updateStatus();
  }

  function updateStatus(text){
    if(text){
      statusEl.textContent = text;
    } else {
      statusEl.textContent = `Player ${currentPlayer === 1 ? '🔴' : '🟡'} to move`;
    }
  }

  function drop(col){
    // finde die unterste freie Zeile
    for(let r = ROWS - 1; r >= 0; r--){
      if(board[r][col] === 0){
        board[r][col] = currentPlayer;
        paintCell(r, col, currentPlayer);
        return r;
      }
    }
    return -1; // Spalte voll
  }

  function paintCell(r, c, player){
    const idx = r * COLS + c;
    const cell = boardEl.children[idx];
    cell.classList.remove('p1','p2');
    if(player === 1) cell.classList.add('p1');
    if(player === 2) cell.classList.add('p2');
  }

  function inBounds(r, c){
    return r >= 0 && r < ROWS && c >= 0 && c < COLS;
  }

  function lineCount(r, c, dr, dc, player, coords){
    let count = 0;
    let rr = r, cc = c;
    while(inBounds(rr, cc) && board[rr][cc] === player){
      coords && coords.push([rr, cc]);
      count++;
      rr += dr; cc += dc;
    }
    return count;
  }

  function checkWin(r, c){
    const player = board[r][c];
    const dirs = [
      [0,1], [1,0], [1,1], [1,-1]
    ];
    for(const [dr, dc] of dirs){
      const coords = [];
      const forward = [];
      const backward = [];
      // Vorwärts sammeln
      let rr = r, cc = c;
      while(inBounds(rr, cc) && board[rr][cc] === player){
        forward.push([rr, cc]);
        rr += dr; cc += dc;
      }
      // Rückwärts sammeln
      rr = r - dr; cc = c - dc;
      while(inBounds(rr, cc) && board[rr][cc] === player){
        backward.push([rr, cc]);
        rr -= dr; cc -= dc;
      }
      const total = forward.length + backward.length;
      if(total >= 4){
        const winCells = forward.concat(backward);
        highlight(winCells);
        return true;
      }
    }
    return false;
  }

  function highlight(cells){
    for(const [r,c] of cells){
      const idx = r * COLS + c;
      boardEl.children[idx].classList.add('win');
    }
  }

  function isDraw(){
    return board[0].every(v => v !== 0);
  }

  boardEl.addEventListener('click', e => {
    if(gameOver) return;
    const cell = e.target.closest('.cell');
    if(!cell) return;
    const col = +cell.dataset.col;
    const row = drop(col);
    if(row === -1) {
      updateStatus("Column is full – choose another!");
      return;
    }
    if(checkWin(row, col)){
      updateStatus(`Spieler ${currentPlayer === 1 ? '🔴' : '🟡'} wins! 🎉`);
      gameOver = true;
      return;
    }
    if(isDraw()){
      updateStatus("Draw!");
      gameOver = true;
      return;
    }
    currentPlayer = 3 - currentPlayer;
    updateStatus();
  });

  restartBtn.addEventListener('click', init);

  init();
})();

	document.addEventListener("contextmenu",function(e){e.preventDefault();});

</script>
</body>
</html>


</template>

<template id="html-ai">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Connect Four</title>
<style>
  :root{
    --cols: 7;
    --rows: 6;
    --cell-size: min(12vw, 70px);
    --p1: #e74c3c;  /* rot (Mensch standard) */
    --p2: #f1c40f;  /* gelb (KI standard)   */
    --empty: #1e90ff;
    --bg: #0e1116;

  }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, sans-serif;
    display:flex;
    flex-direction:column;

  }
  h1{ margin:0.4rem 0; font-size:1.2rem; }
  #topbar{
    display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; justify-content:center;
  }
  label { font-size:.9rem; opacity:.9; }
  select{

  }
  #status{ min-height:1.4rem; }
  #board{
    display:grid;
    grid-template-columns: repeat(var(--cols), var(--cell-size));
    grid-auto-rows: var(--cell-size);
    gap:6px;
    padding:10px;
    background:#145eaa;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,0.35);
    touch-action: manipulation;
    user-select:none;
  }
  .cell{
    width: var(--cell-size);
    height: var(--cell-size);
    background: var(--empty);

    cursor:pointer;
  }
  .disc{
    position:absolute;
    inset:8%;
    border-radius:50%;
    background:#0b2a4d;
    transition: transform 120ms ease;

  .p2 .disc{ background: var(--p2); }
  .win .disc{
    outline:4px solid #2ecc71;

  }

    padding:0.6rem 1rem;
    border-radius:8px;
    cursor:pointer;
  }

    opacity:0.6; font-size:0.8rem; margin-top:0.5rem;
  }
</style>

<body>
  <h1>Connect Four – AI</h1>

  <div id="topbar">
    <label>Difficulty:
      <select id="difficulty">
        <option value="2">Easy (Depth 2)</option>
        <option value="4" selected>Medium (Depth 4)</option>
        <option value="6">Hard (Depth 6)</option>
      </select>
    </label>

    <label>Starting Player:
      <select id="starter">
        <option value="human" selected>Human (Red)</option>
        <option value="ai">AI (Yellow)</option>
      </select>
    </label>

    <button id="restart">Restart</button>
  </div>

  <div id="status"></div>
  <div id="board" aria-label="Game board"></div>

  <footer>Single-file HTML • Minimax + Alpha-Beta • no framework</footer>

<script>
(() => {
  const ROWS = 6, COLS = 7;
  const HUMAN = 1;
  const AI    = 2;

  const WIN_SCORE = 1e6; // groß genug, um alles zu dominieren
  const LOSS_SCORE = -WIN_SCORE;

  const boardEl   = document.getElementById('board');
  const statusEl  = document.getElementById('status');
  const restartBtn= document.getElementById('restart');
  const diffSel   = document.getElementById('difficulty');
  const starterSel= document.getElementById('starter');

  let board, currentPlayer, gameOver, aiDepth, aiPlayer, humanPlayer;

  function init(){
    document.documentElement.style.setProperty('--cols', COLS);
    document.documentElement.style.setProperty('--rows', ROWS);

    aiDepth = parseInt(diffSel.value, 10);
    const starter = starterSel.value;

    board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
    gameOver = false;

    if(starter === 'ai'){
      aiPlayer = HUMAN;   // KI ist gelb (2), aber spielt zuerst -> tauschen wir einfach die Farben? Nein: wir lassen Farben fix, aber currentPlayer setzt, wer dran ist.
      humanPlayer = AI;
      currentPlayer = AI; // KI startet
    } else {
      humanPlayer = HUMAN;
      aiPlayer = AI;
      currentPlayer = HUMAN; // Mensch startet
    }

    boardEl.innerHTML = "";
    for(let r = 0; r < ROWS; r++){
      for(let c = 0; c < COLS; c++){
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.row = r;
        cell.dataset.col = c;
        const disc = document.createElement('div');
        disc.className = 'disc';
        cell.appendChild(disc);
        boardEl.appendChild(cell);
      }
    }
    updateStatus();

    // Wenn KI beginnt, direkt ziehen lassen (per setTimeout, damit DOM erst zeichnet)
    if(currentPlayer === aiPlayer) {
      setTimeout(aiTurn, 50);
    }
  }

  function updateStatus(text){
    if(text){
      statusEl.textContent = text;
    } else if(gameOver){
      // schon gesetzt
    } else {
      const who = currentPlayer === HUMAN ? '🔴 (Human)' : '🟡 (KI)';
      statusEl.textContent = `${who} is up${currentPlayer === aiPlayer ? " … thinking" : ""}`;
    }
  }

  function paintCell(r, c, player){
    const idx = r * COLS + c;
    const cell = boardEl.children[idx];
    cell.classList.remove('p1','p2');
    if(player === 1) cell.classList.add('p1');
    if(player === 2) cell.classList.add('p2');
  }

  function highlight(cells){
    for(const [r,c] of cells){
      const idx = r * COLS + c;
      boardEl.children[idx].classList.add('win');
    }
  }

  function inBounds(r, c){
    return r >= 0 && r < ROWS && c >= 0 && c < COLS;
  }

  function getValidMoves(b){
    const moves = [];
    for(let c=0;c<COLS;c++){
      if(b[0][c] === 0) moves.push(c);
    }
    return moves;
  }

  function drop(b, col, player){
    for(let r = ROWS - 1; r >= 0; r--){
      if(b[r][col] === 0){
        b[r][col] = player;
        return r;
      }
    }
    return -1;
  }

  function undoDrop(b, col){
    for(let r = 0; r < ROWS; r++){
      if(b[r][col] !== 0){
        b[r][col] = 0;
        return;
      }
    }
  }

  function terminalState(b){
    const w = winner(b);
    if(w) return true;
    return getValidMoves(b).length === 0;
  }

  function winner(b){
    // 4er überall prüfen
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        const p = b[r][c];
        if(!p) continue;
        // horizontale
        if(c+3<COLS && p===b[r][c+1] && p===b[r][c+2] && p===b[r][c+3]) return p;
        // vertikale
        if(r+3<ROWS && p===b[r+1][c] && p===b[r+2][c] && p===b[r+3][c]) return p;
        // diag /
        if(r-3>=0 && c+3<COLS && p===b[r-1][c+1] && p===b[r-2][c+2] && p===b[r-3][c+3]) return p;
        // diag \
        if(r+3<ROWS && c+3<COLS && p===b[r+1][c+1] && p===b[r+2][c+2] && p===b[r+3][c+3]) return p;
      }
    }
    return 0;
  }

  function checkWinAndHighlight(r, c){
    const p = board[r][c];
    const dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for(const [dr,dc] of dirs){
      const seq = [[r,c]];
      // forward
      let rr=r+dr, cc=c+dc;
      while(inBounds(rr,cc) && board[rr][cc]===p){ seq.push([rr,cc]); rr+=dr; cc+=dc; }
      // backward
      rr=r-dr; cc=c-dc;
      while(inBounds(rr,cc) && board[rr][cc]===p){ seq.push([rr,cc]); rr-=dr; cc-=dc; }
      if(seq.length>=4){
        highlight(seq);
        return true;
      }
    }
    return false;
  }

  // Bewertung: klassisches "Window"-Scoring
  function scorePosition(b, player){
    const opp = (player === HUMAN) ? AI : HUMAN;
    let score = 0;

    // Zentralspalte gewichten
    const centerCol = Math.floor(COLS/2);
    let centerCount = 0;
    for(let r=0;r<ROWS;r++){
      if(b[r][centerCol] === player) centerCount++;
    }
    score += centerCount * 6;

    // Alle 4er-Fenster scannen
    // horizontal
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS-3;c++){
        const window = [b[r][c], b[r][c+1], b[r][c+2], b[r][c+3]];
        score += evaluateWindow(window, player, opp);
      }
    }
    // vertikal
    for(let c=0;c<COLS;c++){
      for(let r=0;r<ROWS-3;r++){
        const window = [b[r][c], b[r+1][c], b[r+2][c], b[r+3][c]];
        score += evaluateWindow(window, player, opp);
      }
    }
    // diag \
    for(let r=0;r<ROWS-3;r++){
      for(let c=0;c<COLS-3;c++){
        const window = [b[r][c], b[r+1][c], b[r+2][c], b[r+3][c]];
        score += evaluateWindow(window, player, opp);
      }
    }
    // diag /
    for(let r=3;r<ROWS;r++){
      for(let c=0;c<COLS-3;c++){
        const window = [b[r][c], b[r-1][c], b[r-2][c], b[r-3][c]];
        score += evaluateWindow(window, player, opp);
      }
    }

    return score;
  }

  function evaluateWindow(win, player, opp){
    const pCount = win.filter(x => x===player).length;
    const oCount = win.filter(x => x===opp).length;
    const empty  = win.filter(x => x===0).length;
    let s = 0;
    if(pCount===4) s += 100000;
    else if(pCount===3 && empty===1) s += 50;
    else if(pCount===2 && empty===2) s += 10;

    if(oCount===3 && empty===1) s -= 80;
    else if(oCount===2 && empty===2) s -= 5;
    return s;
  }

  function minimax(b, depth, alpha, beta, maximizing){
    const validMoves = getValidMoves(b);
    const w = winner(b);
    if(depth === 0 || w || validMoves.length === 0){
      if(w === aiPlayer) return {score: WIN_SCORE + depth}; // tieferer Sieg = minimal besser
      if(w === humanPlayer) return {score: LOSS_SCORE - depth};
      return {score: scorePosition(b, aiPlayer)}; // Heuristik
    }

    if(maximizing){
      let value = -Infinity;
      let bestCol = validMoves[Math.floor(Math.random()*validMoves.length)];
      for(const col of validMoves){
        const r = drop(b, col, aiPlayer);
        const newScore = minimax(b, depth - 1, alpha, beta, false).score;
        undoDrop(b, col);
        if(newScore > value){
          value = newScore;
          bestCol = col;
        }
        alpha = Math.max(alpha, value);
        if(alpha >= beta) break; // Pruning
      }
      return {col: bestCol, score: value};
    } else {
      let value = Infinity;
      let bestCol = validMoves[Math.floor(Math.random()*validMoves.length)];
      for(const col of validMoves){
        const r = drop(b, col, humanPlayer);
        const newScore = minimax(b, depth - 1, alpha, beta, true).score;
        undoDrop(b, col);
        if(newScore < value){
          value = newScore;
          bestCol = col;
        }
        beta = Math.min(beta, value);
        if(alpha >= beta) break; // Pruning
      }
      return {col: bestCol, score: value};
    }
  }

  function aiTurn(){
    if(gameOver) return;
    updateStatus("KI is thinking …");
    setTimeout(() => {
      const { col } = minimax(board, aiDepth, -Infinity, Infinity, true);
      if(col == null){
        // keine Züge -> Unentschieden
        updateStatus("Draw!");
        gameOver = true;
        return;
      }
      const row = drop(board, col, aiPlayer);
      paintCell(row, col, aiPlayer);

      if(checkWinAndHighlight(row, col)){
        updateStatus("🟡 AI wins! 🎉");
        gameOver = true;
        return;
      }
      if(getValidMoves(board).length === 0){
        updateStatus("Draw!");
        gameOver = true;
        return;
      }
      currentPlayer = humanPlayer;
      updateStatus();
    }, 200); // kleiner Delay, damit die UI "denkt" anzeigen kann
  }

  boardEl.addEventListener('click', e => {
    if(gameOver) return;
    if(currentPlayer !== humanPlayer) return; // Mensch ist nicht dran
    const cell = e.target.closest('.cell');
    if(!cell) return;
    const col = +cell.dataset.col;

    const row = drop(board, col, humanPlayer);
    if(row === -1) {
      updateStatus("Column is full – choose another!");
      return;
    }
    paintCell(row, col, humanPlayer);

    if(checkWinAndHighlight(row, col)){
      updateStatus("🔴 Human wins! 🎉");
      gameOver = true;
      return;
    }
    if(getValidMoves(board).length === 0){
      updateStatus("Draw!");
      gameOver = true;
      return;
    }
    currentPlayer = aiPlayer;
    updateStatus();
    aiTurn();
  });

  restartBtn.addEventListener('click', init);
  diffSel.addEventListener('change', () => { aiDepth = parseInt(diffSel.value,10); });
  starterSel.addEventListener('change', init);

  init();
})();
	
	document.addEventListener("contextmenu",function(e){e.preventDefault();});
	
</script>
</body>
</html>

<script>
const frame = document.getElementById('game');
const mode  = document.getElementById('mode');

const HUMAN_HTML = document.getElementById('html-human').innerHTML.trim();
const AI_HTML    = document.getElementById('html-ai').innerHTML.trim();

function load() {
  frame.srcdoc = (mode.value === 'ai') ? AI_HTML : HUMAN_HTML;
}
document.getElementById('load').addEventListener('click', load);
load(); // initial load

	document.addEventListener("contextmenu",function(e){e.preventDefault();});

</script>
