<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Color Flow Connect</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #2dd4bf; font-weight: 700; }
canvas { background: #111827; border: 2px solid #334155; border-radius: 12px; margin: 20px auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
button { background: #0d9488; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>🟢 COLOR FLOW CONNECT</h1>
  <span>Pipes: <span id="pipe-status" style="color: #facc15;">Connect All</span></span>
</header>
<canvas id="c" width="350" height="350"></canvas>
<button id="btn-clear">Reset Lines</button>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const N = 5;
const CELL = 70;

const PAIRS = [
  { color: '#ef4444', p1: {x: 0, y: 0}, p2: {x: 4, y: 0} },
  { color: '#3b82f6', p1: {x: 0, y: 1}, p2: {x: 0, y: 4} },
  { color: '#22c55e', p1: {x: 1, y: 1}, p2: {x: 4, y: 4} },
  { color: '#eab308', p1: {x: 2, y: 2}, p2: {x: 3, y: 4} }
];

let lines = {};
let activePair = null;

function render() {
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw grid
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 2;
  for (let i=0; i<=N; i++) {
    ctx.beginPath();
    ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, N*CELL);
    ctx.moveTo(0, i*CELL); ctx.lineTo(N*CELL, i*CELL);
    ctx.stroke();
  }

  // Draw dots
  PAIRS.forEach(pair => {
    [pair.p1, pair.p2].forEach(p => {
      ctx.fillStyle = pair.color;
      ctx.beginPath();
      ctx.arc(p.x * CELL + CELL/2, p.y * CELL + CELL/2, 18, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.stroke();
    });
  });
}

document.getElementById('btn-clear').onclick = render;
render();
</script>
</body>
</html>
