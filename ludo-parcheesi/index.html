<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ludo Classic Parchisi</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #facc15; font-weight: 700; }
#ludo-board { width: 340px; height: 340px; background: #fff; margin: 20px auto; border: 4px solid #334155; border-radius: 12px; display: grid; grid-template-columns: 2fr 1fr 2fr; grid-template-rows: 2fr 1fr 2fr; }
.zone { display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.4rem; }
.red-base { background: #ef4444; color: white; }
.green-base { background: #22c55e; color: white; }
.yellow-base { background: #eab308; color: white; }
.blue-base { background: #3b82f6; color: white; }
.center-star { background: #1e293b; color: #facc15; }
.track { background: #f1f5f9; border: 1px solid #cbd5e1; }
button { background: #facc15; color: #0f172a; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>🎲 LUDO PARCHISI</h1>
  <span>Roll: <span id="dice-val" style="color: #facc15;">⚅ 6</span></span>
</header>
<div id="ludo-board">
  <div class="zone red-base">RED</div>
  <div class="zone track">⚀</div>
  <div class="zone green-base">GREEN</div>
  <div class="zone track">⚁</div>
  <div class="zone center-star">★</div>
  <div class="zone track">⚂</div>
  <div class="zone blue-base">BLUE</div>
  <div class="zone track">⚃</div>
  <div class="zone yellow-base">YELLOW</div>
</div>
<button id="btn-roll">Roll Die 🎲</button>
<script>
const D_FACES = ["⚀","⚁","⚂","⚃","⚄","⚅"];
document.getElementById('btn-roll').onclick = function() {
  const v = Math.floor(Math.random() * 6);
  document.getElementById('dice-val').innerText = `${D_FACES[v]} ${v+1}`;
};
</script>
</body>
</html>
