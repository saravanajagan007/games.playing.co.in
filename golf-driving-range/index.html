<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Golf Driving Range</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #4ade80; font-weight: 700; }
canvas { background: #15803d; border: 4px solid #14532d; border-radius: 8px; margin: 16px auto; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>⛳ DRIVING RANGE</h1>
  <span>Longest: <span id="dist" style="color:#facc15; font-weight:700;">0 YDS</span></span>
</header>
<canvas id="c" width="340" height="420"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let ballY = 380, vy = 0;

function update() {
  ballY += vy;
  vy *= 0.98;
  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.fillStyle = '#15803d';
  ctx.fillRect(0, 0, 340, 420);

  // Yardage markers
  ctx.fillStyle = '#f8fafc';
  ctx.fillText("300 YDS", 145, 80);
  ctx.fillText("200 YDS", 145, 180);
  ctx.fillText("100 YDS", 145, 280);

  // Ball
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(170, ballY, 7, 0, Math.PI*2);
  ctx.fill();
}

canvas.addEventListener('click', () => {
  vy = -9;
  document.getElementById('dist').innerText = "285 YDS";
});
update();
</script>
</body>
</html>
