<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mastermind Code Breaker</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.1rem; color: #f43f5e; font-weight: 700; }
#board-box { margin: 12px auto; background: #1e293b; padding: 14px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 340px; display: flex; flex-direction: column; gap: 8px; }
.m-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px; background: #0f172a; border-radius: 8px; border: 1px solid #334155; }
.m-row.active { border-color: #38bdf8; background: #1e293b; }
.pegs { display: flex; gap: 8px; }
.peg { width: 28px; height: 28px; border-radius: 50%; background: #334155; border: 2px solid #475569; }
.hints { display: grid; grid-template-columns: repeat(2, 12px); grid-template-rows: repeat(2, 12px); gap: 4px; }
.hint { width: 12px; height: 12px; border-radius: 50%; background: #334155; }
.hint.exact { background: #ef4444; } /* Red/black for exact match */
.hint.color { background: #f8fafc; } /* White for color match */
#color-palette { display: flex; gap: 10px; margin-top: 10px; }
.palette-btn { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(255,255,255,0.4); box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
#actions { display: flex; gap: 10px; margin-top: 12px; }
button { background: #f43f5e; color: white; border: none; padding: 8px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>🎯 Mastermind Code Breaker</h1>
  <span>Round: <span id="round-txt" style="color: #facc15;">1/8</span></span>
</header>
<div id="board-box">
  <div id="rows-container"></div>
</div>
<div id="color-palette"></div>
<div id="actions">
  <button id="btn-submit">Submit Guess</button>
  <button id="btn-restart" style="background: #475569;">Restart</button>
</div>
<script>
const COLORS = ["#ef4444", "#3b82f6", "#22c55e", "#eab308", "#a855f7", "#ec4899"];
let secret = [];
let curRound = 0;
let currentGuess = [];
const TOTAL_ROUNDS = 8;
const rowsEl = document.getElementById('rows-container');

function initGame() {
  secret = [];
  for (let i=0; i<4; i++) {
    secret.push(COLORS[Math.floor(Math.random() * COLORS.length)]);
  }
  curRound = 0;
  currentGuess = [];
  rowsEl.innerHTML = '';
  for (let r=0; r<TOTAL_ROUNDS; r++) {
    const row = document.createElement('div');
    row.className = 'm-row' + (r === 0 ? ' active' : '');
    row.id = `row-${r}`;
    row.innerHTML = `
      <div class="pegs">
        <div class="peg"></div><div class="peg"></div><div class="peg"></div><div class="peg"></div>
      </div>
      <div class="hints">
        <div class="hint"></div><div class="hint"></div><div class="hint"></div><div class="hint"></div>
      </div>
    `;
    rowsEl.appendChild(row);
  }
  document.getElementById('round-txt').innerText = `1/${TOTAL_ROUNDS}`;
}

const paletteEl = document.getElementById('color-palette');
paletteEl.innerHTML = '';
COLORS.forEach(c => {
  const btn = document.createElement('div');
  btn.className = 'palette-btn';
  btn.style.background = c;
  btn.onclick = () => addColor(c);
  paletteEl.appendChild(btn);
});

function addColor(c) {
  if (currentGuess.length >= 4) return;
  currentGuess.push(c);
  updateCurrentRow();
}

function updateCurrentRow() {
  const row = document.getElementById(`row-${curRound}`);
  const pegs = row.querySelectorAll('.peg');
  pegs.forEach((p, idx) => {
    p.style.background = currentGuess[idx] || '#334155';
    p.style.borderColor = currentGuess[idx] ? '#fff' : '#475569';
  });
}

document.getElementById('btn-submit').onclick = function() {
  if (currentGuess.length < 4) {
    alert("Fill all 4 pegs first!");
    return;
  }
  // Check exact and color matches
  let exact = 0, colorMatches = 0;
  const secCopy = [...secret];
  const guessCopy = [...currentGuess];

  for (let i=0; i<4; i++) {
    if (guessCopy[i] === secCopy[i]) {
      exact++;
      secCopy[i] = null;
      guessCopy[i] = undefined;
    }
  }

  for (let i=0; i<4; i++) {
    if (guessCopy[i] !== undefined) {
      const idx = secCopy.indexOf(guessCopy[i]);
      if (idx !== -1) {
        colorMatches++;
        secCopy[idx] = null;
      }
    }
  }

  const row = document.getElementById(`row-${curRound}`);
  const hints = row.querySelectorAll('.hint');
  let hIdx = 0;
  for (let i=0; i<exact; i++) hints[hIdx++].className = 'hint exact';
  for (let i=0; i<colorMatches; i++) hints[hIdx++].className = 'hint color';

  if (exact === 4) {
    setTimeout(() => alert("Code Cracked! You are a true Mastermind!"), 200);
    return;
  }

  row.classList.remove('active');
  curRound++;
  currentGuess = [];
  if (curRound >= TOTAL_ROUNDS) {
    setTimeout(() => alert("Game Over! Code was hidden well."), 200);
    return;
  }
  document.getElementById(`row-${curRound}`).classList.add('active');
  document.getElementById('round-txt').innerText = `${curRound+1}/${TOTAL_ROUNDS}`;
};

document.getElementById('btn-restart').onclick = initGame;
initGame();
</script>
</body>
</html>
