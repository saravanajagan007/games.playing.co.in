<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pyramid Solitaire Ancient</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #451a03; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: #78350f; border-bottom: 2px solid #b45309; }
h1 { font-size: 1.15rem; color: #fde047; font-weight: 700; }
#pyramid { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: 16px auto; }
.pyr-row { display: flex; gap: 6px; }
.card { width: 48px; height: 68px; background: #f8fafc; color: #0f172a; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.95rem; box-shadow: 0 4px 6px rgba(0,0,0,0.5); cursor: pointer; }
.card.selected { outline: 3px solid #fde047; transform: translateY(-4px); }
.card.empty { background: transparent; box-shadow: none; cursor: default; }
#stock-bar { display: flex; gap: 14px; margin-bottom: 20px; align-items: center; }
button { background: #b45309; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>🔺 PYRAMID SOLITAIRE</h1>
  <span>Sum to 13</span>
</header>
<div id="pyramid"></div>
<div id="stock-bar">
  <button id="btn-draw">Draw Stock 🂠</button>
  <div id="waste-slot"></div>
</div>
<script>
let selected = null;
const pyramidRows = [
  [{ v: 13, r: 'K', s: '♠' }],
  [{ v: 7, r: '7', s: '♥' }, { v: 6, r: '6', s: '♣' }],
  [{ v: 10, r: '10', s: '♦' }, { v: 3, r: '3', s: '♠' }, { v: 8, r: '8', s: '♥' }]
];

function render() {
  const p = document.getElementById('pyramid');
  p.innerHTML = '';
  pyramidRows.forEach((row, rIdx) => {
    const rowEl = document.createElement('div');
    rowEl.className = 'pyr-row';
    row.forEach((c, cIdx) => {
      const cardEl = document.createElement('div');
      cardEl.className = 'card' + (c === null ? ' empty' : '');
      if (c !== null) {
        cardEl.innerText = c.r + c.s;
        if (selected && selected.rIdx === rIdx && selected.cIdx === cIdx) cardEl.classList.add('selected');
        cardEl.onclick = () => onCardClick(rIdx, cIdx);
      }
      rowEl.appendChild(cardEl);
    });
    p.appendChild(rowEl);
  });
}

function onCardClick(rIdx, cIdx) {
  const card = pyramidRows[rIdx][cIdx];
  if (card.v === 13) {
    pyramidRows[rIdx][cIdx] = null;
    selected = null;
    render();
    return;
  }
  if (!selected) {
    selected = { rIdx, cIdx, card };
    render();
  } else {
    if (selected.card.v + card.v === 13) {
      pyramidRows[selected.rIdx][selected.cIdx] = null;
      pyramidRows[rIdx][cIdx] = null;
      selected = null;
      render();
    } else {
      selected = null;
      render();
    }
  }
}

render();
</script>
</body>
</html>
