<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Slingshot Cannon Smash</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #facc15; font-weight: 700; }
canvas { background: #0284c7; border: 2px solid #334155; border-radius: 8px; margin: 16px auto; cursor: grab; }
</style>
</head>
<body>
<header>
  <h1>🎯 SLINGSHOT SMASH</h1>
  <span>Targets Left: <span id="targets" style="color:#facc15;">3</span></span>
</header>
<canvas id="c" width="400" height="340"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let ball = { x: 70, y: 240, vx: 0, vy: 0, flying: false };
let isDragging = false;
let targets = [{ x: 300, y: 220, w: 25, h: 60, hit: false }, { x: 340, y: 200, w: 25, h: 80, hit: false }];

function update() {
  if (ball.flying) {
    ball.vy += 0.35; // gravity
    ball.x += ball.vx;
    ball.y += ball.vy;

    targets.forEach(t => {
      if (!t.hit && ball.x > t.x && ball.x < t.x + t.w && ball.y > t.y && ball.y < t.y + t.h) {
        t.hit = true;
      }
    });

    if (ball.y > 300 || ball.x > 400) {
      ball = { x: 70, y: 240, vx: 0, vy: 0, flying: false };
    }
  }

  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(0, 0, 400, 340);

  // Ground
  ctx.fillStyle = '#15803d';
  ctx.fillRect(0, 280, 400, 60);

  // Slingshot fork
  ctx.fillStyle = '#78350f';
  ctx.fillRect(65, 230, 10, 50);

  // Targets
  targets.forEach(t => {
    if (!t.hit) {
      ctx.fillStyle = '#b45309';
      ctx.fillRect(t.x, t.y, t.w, t.h);
    }
  });

  // Ball
  ctx.fillStyle = '#dc2626';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, 12, 0, Math.PI*2);
  ctx.fill();
}

canvas.addEventListener('mousedown', e => { if (!ball.flying) isDragging = true; });
window.addEventListener('mousemove', e => {
  if (isDragging) {
    const r = canvas.getBoundingClientRect();
    ball.x = e.clientX - r.left;
    ball.y = e.clientY - r.top;
  }
});
window.addEventListener('mouseup', () => {
  if (isDragging) {
    isDragging = false;
    ball.vx = (70 - ball.x) * 0.22;
    ball.vy = (240 - ball.y) * 0.22;
    ball.flying = true;
  }
});

update();
</script>
</body>
</html>
