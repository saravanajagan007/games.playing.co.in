<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>10-Pin Bowling Strike</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #f87171; font-weight: 700; }
canvas { background: #d97706; border: 12px solid #78350f; border-radius: 8px; margin: 16px auto; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>🎳 10-PIN BOWLING</h1>
  <span>Strikes: <span id="strikes" style="color:#facc15; font-weight:700;">0</span></span>
</header>
<canvas id="c" width="300" height="420"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let ball = { x: 150, y: 380, vy: 0, rolling: false };

function update() {
  if (ball.rolling) {
    ball.y += ball.vy;
    if (ball.y < 80) {
      alert("STRIKE! All ten pins knocked down!");
      ball = { x: 150, y: 380, vy: 0, rolling: false };
    }
  }
  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.fillStyle = '#d97706';
  ctx.fillRect(0, 0, 300, 420);

  // Pins triangle
  ctx.fillStyle = '#f8fafc';
  [[150, 60], [130, 45], [170, 45], [110, 30], [150, 30], [190, 30]].forEach(([px, py]) => {
    ctx.beginPath();
    ctx.arc(px, py, 6, 0, Math.PI*2);
    ctx.fill();
  });

  // Bowling ball
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, 16, 0, Math.PI*2);
  ctx.fill();
}

canvas.addEventListener('click', () => {
  if (!ball.rolling) { ball.vy = -8; ball.rolling = true; }
});
update();
</script>
</body>
</html>
