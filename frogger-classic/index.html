<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/embed-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Retro Frogger Highway</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #090d16; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: monospace; color: #fff; }
    #canvas { background: #000000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 12px; max-width: 95vw; max-height: 85vh; }
    .hint { margin-top: 10px; color: #94a3b8; font-size: 13px; font-weight: bold; }
  </style>
</head>
<body>
  <canvas id="canvas" width="480" height="540"></canvas>
  <div class="hint">Arrow Keys or Swipe to Hop Across Highway & River</div>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(f, t, d) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.setValueAtTime(0.12, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + d);
      } catch(e) {}
    }
    const GRID = 36;
    let frog = { x: 6 * GRID, y: 13 * GRID, w: 28, h: 28 };
    let lives = 3, score = 0, state = 'PLAY', goals = [false, false, false, false, false];
    
    // Vehicles (rows 8, 9, 10, 11, 12)
    let lanes = [
      { y: 8 * GRID, spd: -2.2, len: 44, col: '#ef4444', items: [100, 260, 420] },
      { y: 9 * GRID, spd: 3.1, len: 38, col: '#facc15', items: [50, 220, 390] },
      { y: 10 * GRID, spd: -1.8, len: 54, col: '#a855f7', items: [80, 300] },
      { y: 11 * GRID, spd: 2.0, len: 40, col: '#ec4899', items: [60, 240, 410] },
      { y: 12 * GRID, spd: -3.5, len: 32, col: '#38bdf8', items: [40, 200, 360] },
    ];
    // Logs / Turtles (rows 2, 3, 4, 5, 6)
    let river = [
      { y: 2 * GRID, spd: 1.8, len: 110, col: '#854d0e', items: [60, 260] },
      { y: 3 * GRID, spd: -2.4, len: 80, col: '#15803d', items: [40, 180, 340] },
      { y: 4 * GRID, spd: 3.2, len: 140, col: '#854d0e', items: [20, 300] },
      { y: 5 * GRID, spd: -1.6, len: 90, col: '#15803d', items: [80, 260, 420] },
      { y: 6 * GRID, spd: 2.2, len: 120, col: '#854d0e', items: [40, 240] }
    ];

    function kill() {
      lives--;
      beep(150, 'sawtooth', 0.3);
      if (lives <= 0) state = 'OVER';
      else resetFrog();
    }
    function resetFrog() { frog.x = 6 * GRID; frog.y = 13 * GRID; }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // River background
      ctx.fillStyle = '#0284c7'; ctx.fillRect(0, GRID, canvas.width, 6 * GRID);
      // Goal bays
      ctx.fillStyle = '#065f46'; ctx.fillRect(0, 0, canvas.width, GRID);
      for (let i = 0; i < 5; i++) {
        let gx = (1.5 + i * 2.4) * GRID;
        ctx.fillStyle = goals[i] ? '#22c55e' : '#047857';
        ctx.beginPath(); ctx.arc(gx + 14, 18, 14, 0, Math.PI * 2); ctx.fill();
        if (goals[i]) {
          ctx.fillStyle = '#ffffff'; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
          ctx.fillText('🐸', gx + 14, 23);
        }
      }
      // Middle safe pavement
      ctx.fillStyle = '#334155'; ctx.fillRect(0, 7 * GRID, canvas.width, GRID);
      // Road
      ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 8 * GRID, canvas.width, 5 * GRID);
      // Road markings
      ctx.fillStyle = '#fbbf24';
      for (let r = 8; r < 13; r++) {
        for (let x = 0; x < canvas.width; x += 40) ctx.fillRect(x, r * GRID - 1, 20, 2);
      }
      // Bottom start bank
      ctx.fillStyle = '#334155'; ctx.fillRect(0, 13 * GRID, canvas.width, 2 * GRID);

      // Move river logs
      let onLog = false, logSpd = 0;
      river.forEach(lane => {
        lane.items.forEach((x, idx) => {
          let nx = x + lane.spd;
          if (lane.spd > 0 && nx > canvas.width + 40) nx = -lane.len;
          if (lane.spd < 0 && nx < -lane.len - 40) nx = canvas.width + 20;
          lane.items[idx] = nx;
          ctx.fillStyle = lane.col;
          ctx.fillRect(nx, lane.y + 4, lane.len, GRID - 8);
          // Check collision with frog on log
          if (frog.y >= lane.y && frog.y < lane.y + GRID) {
            if (frog.x + frog.w > nx && frog.x < nx + lane.len) {
              onLog = true; logSpd = lane.spd;
            }
          }
        });
      });

      if (frog.y >= 2 * GRID && frog.y <= 6 * GRID) {
        if (!onLog) kill();
        else frog.x += logSpd;
      }

      // Move vehicles
      lanes.forEach(lane => {
        lane.items.forEach((x, idx) => {
          let nx = x + lane.spd;
          if (lane.spd > 0 && nx > canvas.width + 40) nx = -lane.len;
          if (lane.spd < 0 && nx < -lane.len - 40) nx = canvas.width + 20;
          lane.items[idx] = nx;
          ctx.fillStyle = lane.col;
          ctx.fillRect(nx, lane.y + 4, lane.len, GRID - 8);
          // Check crash
          if (frog.y >= lane.y && frog.y < lane.y + GRID) {
            if (frog.x + frog.w > nx + 4 && frog.x + 4 < nx + lane.len) kill();
          }
        });
      });

      // Goal check
      if (frog.y <= GRID) {
        let reached = false;
        for (let i = 0; i < 5; i++) {
          let gx = (1.5 + i * 2.4) * GRID;
          if (Math.abs(frog.x - gx) < 24 && !goals[i]) {
            goals[i] = true; score += 200; beep(880, 'sine', 0.2); reached = true;
            if (goals.every(Boolean)) { score += 1000; goals = [false, false, false, false, false]; }
            resetFrog();
            break;
          }
        }
        if (!reached) kill();
      }

      // Check walls
      if (frog.x < 0 || frog.x > canvas.width - frog.w) kill();

      // Draw Frog
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(frog.x + 4, frog.y + 4, frog.w, frog.h);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(frog.x + 6, frog.y + 6, 4, 4);
      ctx.fillRect(frog.x + frog.w - 10, frog.y + 6, 4, 4);

      // HUD
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 16px monospace'; ctx.textAlign = 'left';
      ctx.fillText('SCORE: ' + score, 15, canvas.height - 15);
      ctx.textAlign = 'right';
      ctx.fillText('LIVES: ' + '🐸'.repeat(Math.max(0, lives)), canvas.width - 15, canvas.height - 15);

      if (state === 'OVER') {
        ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444'; ctx.font = 'bold 32px monospace'; ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = '16px monospace'; ctx.fillStyle = '#cbd5e1';
        ctx.fillText('Tap or Press Space to Restart', canvas.width / 2, canvas.height / 2 + 20);
      }
      requestAnimationFrame(loop);
    }

    function hop(dx, dy) {
      if (state === 'OVER') { lives = 3; score = 0; goals = [false, false, false, false, false]; resetFrog(); state = 'PLAY'; return; }
      frog.x += dx * GRID; frog.y += dy * GRID;
      beep(320, 'square', 0.08);
      score += 10;
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); hop(0, -1); }
      else if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); hop(0, 1); }
      else if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); hop(-1, 0); }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); hop(1, 0); }
      else if (e.code === 'Space' && state === 'OVER') { hop(0, 0); }
    });

    let tsX = 0, tsY = 0;
    canvas.addEventListener('touchstart', e => { tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; }, {passive: false});
    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      let dx = e.changedTouches[0].clientX - tsX, dy = e.changedTouches[0].clientY - tsY;
      if (Math.abs(dx) > Math.abs(dy)) hop(dx > 0 ? 1 : -1, 0);
      else hop(0, dy > 0 ? 1 : -1);
    }, {passive: false});

    loop();
  </script>
</body>
</html>
