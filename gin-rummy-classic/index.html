<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gin Rummy Melds</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #042f2e; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: #115e59; border-bottom: 2px solid #14b8a6; }
h1 { font-size: 1.15rem; color: #2dd4bf; font-weight: 700; }
#hand { display: flex; gap: 6px; margin: 20px auto; flex-wrap: wrap; justify-content: center; }
.card { width: 48px; height: 70px; background: #f8fafc; color: #0f172a; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1rem; cursor: pointer; }
button { background: #0d9488; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>🃏 GIN RUMMY</h1>
  <span>Deadwood: <span id="dw" style="color:#facc15;">4</span> Pts</span>
</header>
<div id="hand">
  <div class="card">7♠</div><div class="card">7♥</div><div class="card">7♦</div>
  <div class="card">10♣</div><div class="card">J♣</div><div class="card">Q♣</div>
  <div class="card">4♦</div>
</div>
<button id="btn-knock">Knock & Tally Melds (Gin!)</button>
<script>
document.getElementById('btn-knock').onclick = function() {
  alert("Gin declared! Set of 7s and Run of Clubs cleanly melded!");
};
</script>
</body>
</html>
