<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mancala Kalah Pit Harvest</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #f59e0b; font-weight: 700; }
#board { width: 440px; height: 180px; background: #78350f; border: 6px solid #451a03; border-radius: 40px; margin: 24px auto; display: flex; align-items: center; justify-content: space-between; padding: 12px; }
.kalah { width: 50px; height: 140px; background: #451a03; border-radius: 25px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 700; color: #facc15; }
.pits-col { display: flex; flex-direction: column; gap: 14px; }
.pits-row { display: flex; gap: 8px; }
.pit { width: 44px; height: 44px; border-radius: 50%; background: #451a03; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; cursor: pointer; color: #f8fafc; }
.pit.user:hover { background: #92400e; }
</style>
</head>
<body>
<header>
  <h1>🪨 MANCALA KALAH</h1>
  <span>Turn: Your Move</span>
</header>
<div id="board">
  <div class="kalah" id="ai-kalah">0</div>
  <div class="pits-col">
    <div class="pits-row" id="ai-pits">
      <div class="pit">4</div><div class="pit">4</div><div class="pit">4</div><div class="pit">4</div><div class="pit">4</div><div class="pit">4</div>
    </div>
    <div class="pits-row" id="user-pits">
      <div class="pit user" onclick="sow(0)">4</div><div class="pit user" onclick="sow(1)">4</div><div class="pit user" onclick="sow(2)">4</div>
      <div class="pit user" onclick="sow(3)">4</div><div class="pit user" onclick="sow(4)">4</div><div class="pit user" onclick="sow(5)">4</div>
    </div>
  </div>
  <div class="kalah" id="user-kalah">0</div>
</div>
<script>
let pits = [4,4,4,4,4,4];
let userScore = 0;

function sow(idx) {
  if (pits[idx] === 0) return;
  let stones = pits[idx];
  pits[idx] = 0;
  userScore += 1;
  document.getElementById('user-kalah').innerText = userScore;
  const pEls = document.querySelectorAll('#user-pits .pit');
  pEls[idx].innerText = '0';
  alert("Pebbles harvested into Kalah store!");
}
</script>
</body>
</html>
