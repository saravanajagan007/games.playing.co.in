<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pattern Lock Logic</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #818cf8; font-weight: 700; }
canvas { background: #111827; border: 2px solid #334155; border-radius: 16px; margin: 20px auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
button { background: #6366f1; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>🔒 PATTERN LOCK</h1>
  <span id="hint">Watch Pattern</span>
</header>
<canvas id="c" width="320" height="320"></canvas>
<button id="btn-demo">Show Target Pattern</button>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const DOTS = [
  {x: 60, y: 60}, {x: 160, y: 60}, {x: 260, y: 60},
  {x: 60, y: 160}, {x: 160, y: 160}, {x: 260, y: 160},
  {x: 60, y: 260}, {x: 160, y: 260}, {x: 260, y: 260}
];

let targetSeq = [0, 1, 4, 7, 8];
let userSeq = [];
let isDragging = false;

function draw(seq, strokeColor='#6366f1') {
  ctx.fillStyle = '#111827';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw lines
  if (seq.length > 1) {
    ctx.strokeStyle = strokeColor;
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(DOTS[seq[0]].x, DOTS[seq[0]].y);
    for (let i=1; i<seq.length; i++) {
      ctx.lineTo(DOTS[seq[i]].x, DOTS[seq[i]].y);
    }
    ctx.stroke();
  }

  // Draw dots
  DOTS.forEach((d, idx) => {
    ctx.fillStyle = seq.includes(idx) ? strokeColor : '#475569';
    ctx.beginPath();
    ctx.arc(d.x, d.y, 14, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 2;
    ctx.stroke();
  });
}

function showDemo() {
  userSeq = [];
  document.getElementById('hint').innerText = "Memorize Pattern!";
  draw(targetSeq, '#facc15');
  setTimeout(() => {
    document.getElementById('hint').innerText = "Your Turn: Draw Pattern";
    draw([]);
  }, 1600);
}

function getDotAt(x, y) {
  for (let i=0; i<DOTS.length; i++) {
    if (Math.hypot(DOTS[i].x - x, DOTS[i].y - y) < 30) return i;
  }
  return null;
}

canvas.addEventListener('mousedown', e => {
  const r = canvas.getBoundingClientRect();
  const idx = getDotAt(e.clientX - r.left, e.clientY - r.top);
  if (idx !== null) {
    isDragging = true;
    userSeq = [idx];
    draw(userSeq);
  }
});

canvas.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const r = canvas.getBoundingClientRect();
  const idx = getDotAt(e.clientX - r.left, e.clientY - r.top);
  if (idx !== null && !userSeq.includes(idx)) {
    userSeq.push(idx);
    draw(userSeq);
  }
});

window.addEventListener('mouseup', () => {
  if (!isDragging) return;
  isDragging = false;
  if (JSON.stringify(userSeq) === JSON.stringify(targetSeq)) {
    draw(userSeq, '#22c55e');
    setTimeout(() => alert("Access Granted! Pattern unlocked perfectly!"), 150);
  } else {
    draw(userSeq, '#ef4444');
    setTimeout(() => {
      alert("Incorrect pattern! Try again.");
      draw([]);
    }, 200);
  }
});

document.getElementById('btn-demo').onclick = showDemo;
showDemo();
</script>
</body>
</html>
