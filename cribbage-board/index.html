<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cribbage Score Master</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #fb923c; font-weight: 700; }
#peg-board { width: 340px; height: 100px; background: #78350f; border: 4px solid #451a03; border-radius: 12px; margin: 20px auto; display: flex; align-items: center; justify-content: space-around; padding: 10px; }
.peg-track { display: flex; gap: 8px; }
.hole { width: 12px; height: 12px; border-radius: 50%; background: #451a03; }
.hole.peg { background: #facc15; box-shadow: 0 0 8px #facc15; }
#hand { display: flex; gap: 8px; margin: 20px auto; }
.card { width: 50px; height: 74px; background: #f8fafc; color: #0f172a; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.2rem; cursor: pointer; }
button { background: #ea580c; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>📌 CRIBBAGE MASTER</h1>
  <span>Peg: <span id="pts" style="color:#facc15;">24</span> / 121</span>
</header>
<div id="peg-board">
  <div class="peg-track">
    <div class="hole"></div><div class="hole"></div><div class="hole peg"></div><div class="hole"></div><div class="hole"></div>
  </div>
</div>
<div id="hand">
  <div class="card">5♠</div>
  <div class="card">5♥</div>
  <div class="card">J♦</div>
  <div class="card">K♣</div>
</div>
<button id="btn-count">Count Fifteen-Two (+8 Pts)</button>
<script>
document.getElementById('btn-count').onclick = function() {
  document.getElementById('pts').innerText = "32";
  alert("15-two, 15-four, pair is 6, knobs is 7, 8 points total!");
};
</script>
</body>
</html>
