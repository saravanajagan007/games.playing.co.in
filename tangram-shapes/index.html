<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tangram Master</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 460px; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #c084fc; font-weight: 700; }
canvas { background: #111827; border: 2px solid #334155; border-radius: 12px; margin: 14px auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
#bar { display: flex; gap: 10px; }
button { background: #a855f7; color: white; border: none; padding: 8px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>📐 TANGRAM MASTER</h1>
  <span>Target: <span id="shape-name" style="color: #facc15;">Swan</span></span>
</header>
<canvas id="c" width="400" height="420"></canvas>
<div id="bar">
  <button id="btn-rot">Rotate Selected ↻</button>
  <button id="btn-reset">Reset Pieces</button>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let pieces = [
  { id: 1, pts: [[0,0],[100,0],[0,100]], color: '#ef4444', x: 50, y: 260, rot: 0 },
  { id: 2, pts: [[0,0],[100,0],[0,100]], color: '#3b82f6', x: 180, y: 260, rot: 90 },
  { id: 3, pts: [[0,0],[70,0],[0,70]], color: '#22c55e', x: 290, y: 260, rot: 0 },
  { id: 4, pts: [[0,0],[50,0],[0,50]], color: '#eab308', x: 50, y: 350, rot: 45 },
  { id: 5, pts: [[0,0],[50,0],[0,50]], color: '#a855f7', x: 140, y: 350, rot: 180 },
  { id: 6, pts: [[0,0],[50,0],[50,50],[0,50]], color: '#ec4899', x: 230, y: 350, rot: 0 },
  { id: 7, pts: [[0,0],[50,0],[75,50],[25,50]], color: '#06b6d4', x: 310, y: 350, rot: 0 }
];

let selected = null;
let dragOffX = 0, dragOffY = 0;

function drawPiece(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate((p.rot * Math.PI) / 180);
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.moveTo(p.pts[0][0], p.pts[0][1]);
  for (let i=1; i<p.pts.length; i++) {
    ctx.lineTo(p.pts[i][0], p.pts[i][1]);
  }
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = p === selected ? '#ffffff' : 'rgba(0,0,0,0.4)';
  ctx.lineWidth = p === selected ? 3 : 1;
  ctx.stroke();
  ctx.restore();
}

function render() {
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Target Silhouette Guide
  ctx.fillStyle = '#1e293b';
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 2;
  ctx.fillRect(100, 30, 200, 180);
  ctx.strokeRect(100, 30, 200, 180);
  ctx.fillStyle = '#475569';
  ctx.font = '14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Silhouette Target Area', 200, 125);

  pieces.forEach(drawPiece);
}

function getClickedPiece(mx, my) {
  for (let i = pieces.length - 1; i >= 0; i--) {
    const p = pieces[i];
    const dx = mx - p.x;
    const dy = my - p.y;
    if (Math.hypot(dx, dy) < 45) return p;
  }
  return null;
}

canvas.addEventListener('mousedown', e => {
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left;
  const my = e.clientY - r.top;
  selected = getClickedPiece(mx, my);
  if (selected) {
    dragOffX = mx - selected.x;
    dragOffY = my - selected.y;
    // Bring to top
    pieces = pieces.filter(p => p !== selected).concat([selected]);
  }
  render();
});

window.addEventListener('mousemove', e => {
  if (!selected) return;
  const r = canvas.getBoundingClientRect();
  selected.x = e.clientX - r.left - dragOffX;
  selected.y = e.clientY - r.top - dragOffY;
  render();
});

window.addEventListener('mouseup', () => { selected = null; render(); });

document.getElementById('btn-rot').onclick = () => {
  if (pieces.length) {
    pieces[pieces.length - 1].rot = (pieces[pieces.length - 1].rot + 45) % 360;
    render();
  }
};

render();
</script>
</body>
</html>
