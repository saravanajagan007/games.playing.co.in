<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yahtzee 5-Dice Roller</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #ef4444; font-weight: 700; }
#dice-cup { display: flex; gap: 12px; margin: 24px auto; }
.die { width: 56px; height: 56px; background: #f8fafc; color: #0f172a; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: transform 0.15s; }
.die.held { outline: 4px solid #ef4444; transform: translateY(-8px); }
#actions { display: flex; gap: 10px; margin-bottom: 20px; }
button { background: #ef4444; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 1rem; }
#scorecard { width: 340px; background: #1e293b; border-radius: 10px; padding: 10px; }
.score-row { display: flex; justify-content: space-between; padding: 6px 10px; border-bottom: 1px solid #334155; font-size: 0.95rem; }
</style>
</head>
<body>
<header>
  <h1>🎲 YAHTZEE ROLLER</h1>
  <span>Roll: <span id="roll-count" style="color: #facc15;">1/3</span></span>
</header>
<div id="dice-cup"></div>
<div id="actions">
  <button id="btn-roll">Roll Dice 🎲</button>
</div>
<div id="scorecard">
  <div class="score-row"><span>Total Score:</span><span id="tot-score" style="color:#ef4444; font-weight:700;">0</span></div>
  <div class="score-row"><span>Three of a Kind:</span><span id="s-3k">--</span></div>
  <div class="score-row"><span>Full House (25):</span><span id="s-fh">--</span></div>
  <div class="score-row"><span>Yahtzee (50):</span><span id="s-y">--</span></div>
</div>
<script>
const DIE_FACES = ["⚀","⚁","⚂","⚃","⚄","⚅"];
let dice = [1, 2, 3, 4, 5];
let held = [false, false, false, false, false];
let rollsLeft = 3;

function renderDice() {
  const c = document.getElementById('dice-cup');
  c.innerHTML = '';
  document.getElementById('roll-count').innerText = `${4 - rollsLeft}/3`;

  dice.forEach((val, idx) => {
    const d = document.createElement('div');
    d.className = 'die' + (held[idx] ? ' held' : '');
    d.innerText = DIE_FACES[val - 1];
    d.onclick = () => {
      held[idx] = !held[idx];
      renderDice();
    };
    c.appendChild(d);
  });
}

document.getElementById('btn-roll').onclick = function() {
  if (rollsLeft > 0) {
    for (let i=0; i<5; i++) {
      if (!held[i]) dice[i] = Math.floor(Math.random() * 6) + 1;
    }
    rollsLeft--;
    renderDice();
    if (rollsLeft === 0) calculateScores();
  } else {
    rollsLeft = 3;
    held = [false, false, false, false, false];
    renderDice();
  }
};

function calculateScores() {
  const counts = {};
  dice.forEach(x => { counts[x] = (counts[x] || 0) + 1; });
  const vals = Object.values(counts);
  
  if (vals.includes(5)) document.getElementById('s-y').innerText = "50 ★ YAHTZEE!";
  if (vals.includes(3) && vals.includes(2)) document.getElementById('s-fh').innerText = "25";
  if (vals.some(v => v >= 3)) document.getElementById('s-3k').innerText = dice.reduce((a,b)=>a+b, 0);
}

renderDice();
</script>
</body>
</html>
