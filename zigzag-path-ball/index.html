<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zigzag Path Wall Runner</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #f472b6; font-weight: 700; }
canvas { background: #1e293b; border: 2px solid #ec4899; border-radius: 8px; margin: 16px auto; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>⚡ ZIGZAG RUNNER</h1>
  <span>Score: <span id="score" style="color:#f472b6; font-weight:700;">0</span></span>
</header>
<canvas id="c" width="340" height="440"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let ballX = 170, ballY = 250;
let dir = 'right'; // 'right' or 'left'
let score = 0;

function update() {
  if (dir === 'right') { ballX += 2.5; ballY -= 1.5; }
  else { ballX -= 2.5; ballY -= 1.5; }
  score++;
  document.getElementById('score').innerText = Math.floor(score/10);
  if (ballX < 30 || ballX > 310) {
    alert("Fell off the wall! Score: " + Math.floor(score/10));
    ballX = 170; ballY = 250; score = 0;
  }
  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, 340, 440);

  // Platform path
  ctx.fillStyle = '#334155';
  ctx.fillRect(60, 100, 220, 240);

  // Ball
  ctx.fillStyle = '#ec4899';
  ctx.beginPath();
  ctx.arc(ballX, ballY, 12, 0, Math.PI*2);
  ctx.fill();
}

canvas.addEventListener('click', () => {
  dir = dir === 'right' ? 'left' : 'right';
});
update();
</script>
</body>
</html>
