<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Knife Hit Wood Master</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #fb923c; font-weight: 700; }
canvas { background: #111827; border: 2px solid #334155; border-radius: 8px; margin: 16px auto; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>🗡️ KNIFE HIT MASTER</h1>
  <span>Knives: <span id="knives" style="color:#fb923c; font-weight:700;">7</span></span>
</header>
<canvas id="c" width="340" height="460"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let angle = 0;
let stuckAngles = [0.4, 2.5];
let knifeY = 380;
let throwing = false;
let knivesLeft = 7;

function update() {
  angle += 0.035;

  if (throwing) {
    knifeY -= 20;
    if (knifeY <= 190) {
      // Check collision with existing stuck knives
      const hitAngle = Math.PI/2 - angle;
      const normHit = ((hitAngle % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);

      let collided = false;
      stuckAngles.forEach(a => {
        const normA = ((a % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
        if (Math.abs(normHit - normA) < 0.25) collided = true;
      });

      if (collided) {
        alert("Clash! You struck an existing blade!");
        stuckAngles = [0.4, 2.5];
        knivesLeft = 7;
      } else {
        stuckAngles.push(normHit);
        knivesLeft--;
        if (knivesLeft === 0) {
          alert("Log Cleared! Masterful knife throwing!");
          stuckAngles = [];
          knivesLeft = 8;
        }
      }
      document.getElementById('knives').innerText = knivesLeft;
      throwing = false;
      knifeY = 380;
    }
  }

  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, 340, 460);

  // Rotating target log
  ctx.save();
  ctx.translate(170, 130);
  ctx.rotate(angle);
  ctx.fillStyle = '#78350f';
  ctx.beginPath();
  ctx.arc(0, 0, 60, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#b45309';
  ctx.lineWidth = 4;
  ctx.stroke();

  // Embedded knives
  stuckAngles.forEach(a => {
    ctx.save();
    ctx.rotate(a);
    ctx.fillStyle = '#cbd5e1';
    ctx.fillRect(-4, 60, 8, 45);
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(-6, 95, 12, 10);
    ctx.restore();
  });
  ctx.restore();

  // Active knife
  ctx.fillStyle = '#cbd5e1';
  ctx.fillRect(166, knifeY, 8, 45);
  ctx.fillStyle = '#ef4444';
  ctx.fillRect(164, knifeY + 35, 12, 10);
}

canvas.addEventListener('click', () => {
  if (!throwing) throwing = true;
});

update();
</script>
</body>
</html>
