<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Super Pixel Jump</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #4ade80; font-weight: 700; }
canvas { background: #38bdf8; border: 2px solid #334155; border-radius: 8px; margin: 16px auto; }
</style>
</head>
<body>
<header>
  <h1>🏃 PIXEL JUMP</h1>
  <span>Coins: <span id="coins" style="color:#facc15; font-weight:700;">0</span></span>
</header>
<canvas id="c" width="400" height="260"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let px = 50, py = 190, vx = 0, vy = 0, onGround = true;

function update() {
  vy += 0.4;
  px += vx;
  py += vy;

  if (py >= 190) { py = 190; vy = 0; onGround = true; }
  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(0, 0, 400, 260);

  // Ground
  ctx.fillStyle = '#15803d';
  ctx.fillRect(0, 220, 400, 40);

  // Flag
  ctx.fillStyle = '#ef4444';
  ctx.fillRect(360, 160, 25, 20);
  ctx.fillStyle = '#f8fafc';
  ctx.fillRect(358, 160, 4, 60);

  // Player
  ctx.fillStyle = '#ea580c';
  ctx.fillRect(px, py, 24, 30);
}

window.addEventListener('keydown', e => {
  if (['ArrowLeft','KeyA'].includes(e.code)) vx = -3;
  if (['ArrowRight','KeyD'].includes(e.code)) vx = 3;
  if (['ArrowUp','KeyW','Space'].includes(e.code) && onGround) { vy = -8.5; onGround = false; }
});
window.addEventListener('keyup', e => {
  if (['ArrowLeft','ArrowRight','KeyA','KeyD'].includes(e.code)) vx = 0;
});
update();
</script>
</body>
</html>
