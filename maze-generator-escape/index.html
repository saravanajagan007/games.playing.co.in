<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Labyrinth Maze Escape</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #10b981; font-weight: 700; }
canvas { background: #0f172a; border: 2px solid #334155; border-radius: 12px; margin: 16px auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
#dpad { display: grid; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(2, 45px); gap: 6px; }
.d-btn { background: #334155; color: #f8fafc; font-size: 1.2rem; border-radius: 8px; border: 1px solid #475569; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<header>
  <h1>🌀 LABYRINTH ESCAPE</h1>
  <span>Level: <span id="lvl" style="color: #facc15;">1</span></span>
</header>
<canvas id="c" width="360" height="360"></canvas>
<div id="dpad">
  <div></div><button class="d-btn" id="d-up">▲</button><div></div>
  <button class="d-btn" id="d-left">◀</button><button class="d-btn" id="d-down">▼</button><button class="d-btn" id="d-right">▶</button>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const COLS = 15, ROWS = 15;
const CELL = 24;

let grid = [];
let px = 0, py = 0;
let level = 1;

// 0: path, 1: wall
function generateMaze() {
  grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(1));
  function walk(x, y) {
    grid[y][x] = 0;
    const dirs = [[0,-2],[0,2],[-2,0],[2,0]].sort(() => Math.random() - 0.5);
    for (let [dx, dy] of dirs) {
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && grid[ny][nx] === 1) {
        grid[y + dy/2][x + dx/2] = 0;
        walk(nx, ny);
      }
    }
  }
  walk(0, 0);
  grid[ROWS-1][COLS-1] = 0;
  px = 0; py = 0;
  draw();
}

function draw() {
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  for (let r=0; r<ROWS; r++) {
    for (let c=0; c<COLS; c++) {
      if (grid[r][c] === 1) {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
      }
    }
  }

  // Draw exit
  ctx.fillStyle = '#10b981';
  ctx.fillRect((COLS-1) * CELL + 4, (ROWS-1) * CELL + 4, CELL - 8, CELL - 8);

  // Draw player
  ctx.fillStyle = '#38bdf8';
  ctx.beginPath();
  ctx.arc(px * CELL + CELL/2, py * CELL + CELL/2, CELL/2 - 4, 0, Math.PI*2);
  ctx.fill();
}

function move(dx, dy) {
  const nx = px + dx, ny = py + dy;
  if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && grid[ny][nx] === 0) {
    px = nx; py = ny;
    draw();
    if (px === COLS - 1 && py === ROWS - 1) {
      setTimeout(() => {
        alert("Escaped! Next maze ready.");
        level++;
        document.getElementById('lvl').innerText = level;
        generateMaze();
      }, 100);
    }
  }
}

window.addEventListener('keydown', e => {
  if (['ArrowUp','KeyW'].includes(e.code)) move(0, -1);
  if (['ArrowDown','KeyS'].includes(e.code)) move(0, 1);
  if (['ArrowLeft','KeyA'].includes(e.code)) move(-1, 0);
  if (['ArrowRight','KeyD'].includes(e.code)) move(1, 0);
});

document.getElementById('d-up').onclick = () => move(0, -1);
document.getElementById('d-down').onclick = () => move(0, 1);
document.getElementById('d-left').onclick = () => move(-1, 0);
document.getElementById('d-right').onclick = () => move(1, 0);

generateMaze();
</script>
</body>
</html>
