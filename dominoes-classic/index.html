<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Classic Block Dominoes</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #fbbf24; font-weight: 700; }
#table-area { width: 100%; max-width: 480px; height: 320px; background: #064e3b; border-radius: 12px; margin: 10px auto; display: flex; align-items: center; justify-content: center; gap: 8px; overflow-x: auto; padding: 10px; border: 4px solid #047857; }
.domino { width: 44px; height: 80px; background: #f8fafc; color: #0f172a; border-radius: 6px; border: 1px solid #cbd5e1; display: flex; flex-direction: column; justify-content: space-around; align-items: center; font-weight: 700; font-size: 1.3rem; box-shadow: 0 4px 6px rgba(0,0,0,0.4); cursor: pointer; }
.domino .line { width: 80%; height: 2px; background: #94a3b8; }
#player-tray { display: flex; gap: 8px; padding: 12px; background: #1e293b; border-radius: 12px; margin-bottom: 16px; }
</style>
</head>
<body>
<header>
  <h1>🁠 BLOCK DOMINOES</h1>
  <span>Opponent: <span id="opp-count" style="color: #facc15;">5</span> tiles</span>
</header>
<div id="table-area" id="train"></div>
<div id="player-tray"></div>
<script>
let train = [{ a: 6, b: 6 }];
let hand = [{ a: 6, b: 5 }, { a: 5, b: 3 }, { a: 6, b: 2 }, { a: 2, b: 4 }, { a: 1, b: 1 }];

function render() {
  const tEl = document.getElementById('table-area');
  tEl.innerHTML = '';
  train.forEach(d => {
    const el = document.createElement('div');
    el.className = 'domino';
    el.innerHTML = `<div>${d.a}</div><div class="line"></div><div>${d.b}</div>`;
    tEl.appendChild(el);
  });

  const pEl = document.getElementById('player-tray');
  pEl.innerHTML = '';
  hand.forEach((d, idx) => {
    const el = document.createElement('div');
    el.className = 'domino';
    el.innerHTML = `<div>${d.a}</div><div class="line"></div><div>${d.b}</div>`;
    el.onclick = () => playTile(idx);
    pEl.appendChild(el);
  });
}

function playTile(idx) {
  const d = hand[idx];
  const leftEnd = train[0].a;
  const rightEnd = train[train.length - 1].b;

  if (d.b === leftEnd) {
    train.unshift(d);
    hand.splice(idx, 1);
  } else if (d.a === leftEnd) {
    train.unshift({ a: d.b, b: d.a });
    hand.splice(idx, 1);
  } else if (d.a === rightEnd) {
    train.push(d);
    hand.splice(idx, 1);
  } else if (d.b === rightEnd) {
    train.push({ a: d.b, b: d.a });
    hand.splice(idx, 1);
  } else {
    alert("This bone does not match either train end!");
    return;
  }
  render();
  if (hand.length === 0) alert("Domino! You emptied your hand to win!");
}

render();
</script>
</body>
</html>
