<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chinese Checkers Star</title>
<script src="/embed-guard.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
header { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: #1e293b; border-bottom: 2px solid #334155; }
h1 { font-size: 1.15rem; color: #818cf8; font-weight: 700; }
canvas { background: #1e293b; border-radius: 12px; margin: 20px auto; border: 2px solid #334155; }
</style>
</head>
<body>
<header>
  <h1>⭐ CHINESE CHECKERS</h1>
  <span>Star Jump</span>
</header>
<canvas id="c" width="340" height="340"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function drawStar() {
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(0, 0, 340, 340);

  // Draw nodes
  for (let y=30; y<=310; y+=35) {
    for (let x=30; x<=310; x+=35) {
      if (Math.hypot(x - 170, y - 170) < 130) {
        ctx.fillStyle = '#334155';
        ctx.beginPath();
        ctx.arc(x, y, 7, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }

  // Draw player marbles
  const marbles = [
    {x: 170, y: 55, c: '#ef4444'}, {x: 152, y: 90, c: '#ef4444'}, {x: 188, y: 90, c: '#ef4444'},
    {x: 170, y: 285, c: '#38bdf8'}, {x: 152, y: 250, c: '#38bdf8'}, {x: 188, y: 250, c: '#38bdf8'}
  ];
  marbles.forEach(m => {
    ctx.fillStyle = m.c;
    ctx.beginPath();
    ctx.arc(m.x, m.y, 11, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.stroke();
  });
}
drawStar();
</script>
</body>
</html>
